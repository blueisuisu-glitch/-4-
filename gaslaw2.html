<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>기체 반응 법칙 — 아레스 4 프로젝트</title>
<style>
  :root{
    --bg:#f1f5f9; --panel:#ffffff; --line:#d3dbe6; --line2:#e2e8f0;
    --ink:#16202f; --dim:#5a6478; --faint:#94a0b4;
    --accent:#15a34a; --accent-bg:#e7f7ee; --accent-line:#a7e0be;
    --warn:#d9670f; --warn-bg:#fdf0e4; --warn-line:#f2c79a;
    --bad:#d63c33; --bad-bg:#fdeceb; --bad-line:#f2b3ae;
    --info:#2563c9; --info-bg:#e8f0fd;
    --H:#f8fafc; --O:#ef4444; --N:#3b82f6; --Cl:#22c55e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px}

  header{margin-bottom:22px}
  .eyebrow{font-size:20px;letter-spacing:.2em;color:var(--warn);text-transform:uppercase;font-weight:800;margin-bottom:10px}
  h1{font-size:46px;font-weight:800;line-height:1.2}

  .story{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);
    border-radius:0 16px 16px 0;padding:20px 24px;margin-bottom:22px;font-size:24px;line-height:1.6;color:var(--ink)}
  .story b{color:var(--warn)}

  .missions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .mtab{flex:1;min-width:150px;padding:20px 18px;background:var(--panel);border:2px solid var(--line);
    border-radius:16px;cursor:pointer;text-align:center;transition:.14s;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .mtab:hover{border-color:var(--warn-line);background:var(--warn-bg)}
  .mtab.on{border-color:var(--warn);background:var(--warn-bg)}
  .mtab.advanced{border-left:5px solid var(--info)}
  .mtab.advanced.on{border-color:var(--info);background:var(--info-bg)}
  .mtab.assesstab{border-left:5px solid var(--warn)}
  .mtab.assesstab.on{border-color:var(--warn);background:var(--warn-bg)}
  .mtab .mt{font-size:22px;font-weight:800}
  .mtab .md{font-size:15px;color:var(--dim);margin-top:5px}
  .mtab .mt-check{color:var(--accent);font-weight:800;margin-left:6px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 28px;margin-bottom:20px;
    box-shadow:0 1px 3px rgba(20,30,50,.05)}
  .panel h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-bottom:18px}

  .gasbox{background:var(--panel);border:1px solid var(--line);border-radius:20px;
    padding:28px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,50,.06)}
  .eqline{text-align:center;font-size:24px;font-weight:700;color:var(--ink);margin-bottom:24px;letter-spacing:.02em}
  .eqline .arrow{color:var(--faint);padding:0 10px}
  .coefin{width:40px;height:40px;border:2px solid var(--warn-line);background:#fff;color:var(--warn);
    font-size:22px;font-weight:800;text-align:center;border-radius:9px;font-family:inherit;
    margin:0 3px;vertical-align:middle}
  .coefin:focus{outline:none;border-color:var(--warn);background:var(--warn-bg)}
  .blankgrp{display:inline-flex;gap:4px;align-items:center;margin:0 4px;vertical-align:middle}
  .formgrp{display:inline-flex;flex-direction:column;align-items:center;gap:7px;margin:0 8px 12px;vertical-align:top}
  .formpreview{min-width:56px;min-height:22px;font-size:23px;font-weight:800;color:var(--warn);
    background:var(--warn-bg);border:1.5px solid var(--warn-line);border-radius:9px;padding:5px 12px;line-height:1.25}
  .lawblank{background:var(--warn-bg)!important;border-color:var(--warn)!important;color:var(--warn)!important;
    font-weight:800;min-width:92px;font-size:22px;padding:0 10px}
  .lawblank.correct{background:var(--accent-bg)!important;border-color:var(--accent)!important;color:#0f5c30!important}
  .lawblank::placeholder{color:#c3cad6;font-weight:400;font-size:15px}
  .lawbox{background:#f8fafc;border:1.5px solid var(--line);border-radius:14px;padding:22px 20px;
    text-align:center;font-size:21px;line-height:2.3;color:var(--ink)}
  .lawword{color:var(--warn);font-weight:800}
  .emph-red{color:#d63c33;font-weight:800}
  .lawword-reason{color:var(--accent);font-weight:800}
  .lawword-def{color:var(--info);font-weight:800}
  .readbox{background:#eef4ff;border:1.5px solid #b9d3f5;border-radius:14px;padding:18px 20px;
    margin-bottom:16px;font-size:19px;line-height:1.65;color:var(--ink)}
  .readbox .rb-tag{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.04em;
    color:var(--info);background:#dbe8ff;padding:3px 10px;border-radius:999px;margin-bottom:8px}
  .forminput{min-width:74px;max-width:120px;height:40px;border:2px solid var(--warn-line);background:#fff;color:var(--ink);
    font-size:19px;font-weight:700;text-align:center;border-radius:9px;font-family:inherit;padding:0 8px;
    margin:0 3px;vertical-align:middle}
  .forminput:focus{outline:none;border-color:var(--warn);background:var(--warn-bg)}
  .forminput::placeholder{color:#c3cad6;font-weight:400}
  .subrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
  .subcol{flex:1;min-width:180px;max-width:340px;background:#f8fafc;border:2px solid var(--line);
    border-radius:16px;padding:18px 14px 22px;text-align:center;transition:.2s}
  .subcol.correct{border-color:var(--accent);box-shadow:0 0 0 3px rgba(21,163,74,.22), 0 0 18px rgba(21,163,74,.22)}
  .subcol .snm{font-size:19px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .subcol .sform{font-size:15px;color:var(--dim);margin-top:2px;margin-bottom:14px}
  .counter{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:20px}
  .counter button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:#fff;
    color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;transition:.12s}
  .counter button:hover{border-color:var(--faint)}
  .counter button:disabled{opacity:.35;cursor:not-allowed}
  .counter .cval{font-size:22px;font-weight:800;color:var(--warn);min-width:26px}

  .boxrow{display:flex;gap:6px;justify-content:center;flex-wrap:nowrap}
  .vbox{flex:1;min-width:0;max-width:138px;aspect-ratio:144/156}
  .boxrow.two{flex-wrap:wrap}
  .boxrow.two .vbox{flex:0 0 calc((100% - 12px)/3)}
  .vbox-fixed{flex:0 0 76px;width:76px;aspect-ratio:144/156}
  .vbox-fixed svg{display:block;width:100%;height:100%}
  .vbox svg{display:block;width:100%;height:100%}
  .gasnote{margin-top:20px;padding:16px 18px;background:#f8fafc;border-left:4px solid var(--warn);
    border-radius:0 12px 12px 0;font-size:16px;line-height:1.6;color:var(--dim);text-align:center}
  .gasnote.show-correct{border-left-color:var(--accent);background:var(--accent-bg);color:#0f5c30}
  .gasnote b{color:var(--ink)}

  .q{margin-bottom:22px}
  .q label{display:block;font-size:22px;font-weight:700;margin-bottom:13px;line-height:1.5}
  .q textarea,.q select{
    width:100%;background:#f8fafc;border:2px solid var(--line);color:var(--ink);border-radius:12px;
    padding:16px;font-family:inherit;font-size:22px;line-height:1.55;outline:none}
  .q textarea{resize:vertical;min-height:100px}
  .q textarea:focus,.q select:focus{outline:none;border-color:var(--warn);background:#fff}

  .done-btn{width:100%;padding:22px;border-radius:16px;border:none;background:var(--accent);color:#fff;
    font-size:25px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 2px 5px rgba(21,163,74,.22)}
  .done-btn:hover{filter:brightness(1.06)}
  .done-btn:disabled{opacity:.5;cursor:not-allowed}
  .tstatus{font-size:19px;margin-top:12px;display:none;color:var(--dim)}
  .tstatus.show{display:block}
  .tstatus.err{color:var(--bad)}
  .tstatus.ok{color:var(--accent);font-weight:700}

  /* ---- 형성평가 박스 ---- */
  .assess{border:3px solid var(--warn);border-radius:18px;padding:30px 24px 24px;margin-top:0;margin-bottom:16px;position:relative;background:var(--panel)}
  .assess-tag{position:absolute;top:-19px;left:22px;background:var(--warn);color:#fff;
    padding:7px 18px;border-radius:999px;font-weight:800;font-size:17px;letter-spacing:.03em}

  .idbar{display:flex;gap:14px;align-items:center;background:#f8fafc;border:1px solid var(--line);
    border-radius:14px;padding:16px 20px;margin-bottom:10px;flex-wrap:wrap}
  .idbar label{font-size:20px;color:var(--dim);font-weight:700}
  .idbar select,.idbar input[type=text]{background:#fff;border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:11px 14px;font-family:inherit;font-size:22px}
  .idbar input[type=text]{width:110px}
  .privacy-note{font-size:17px;color:var(--faint);margin-bottom:20px;line-height:1.5}

  .pstepbar{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
  .pstep{padding:6px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--faint);font-size:14px;font-weight:700}
  .pstep.now{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
  .pstep.done{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
  .pprompt{text-align:center;font-size:17px;line-height:1.6;color:var(--ink);margin:4px 0 18px}
  .givenTag{display:inline-block;margin-bottom:20px;padding:8px 14px;border-radius:10px;background:#eef4ff;border:1.5px solid #b9d3f5;color:var(--info);font-size:15px;font-weight:800}
  .nextbtn{margin-top:14px;padding:12px 28px;border-radius:12px;border:none;background:var(--accent);color:#fff;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit}
  .concl{margin-top:16px;padding:18px 18px;background:#fff;border:2px solid var(--accent);border-radius:14px;text-align:center;font-size:17px;line-height:1.8;color:var(--ink)}
  .concl-tag{display:inline-block;margin-bottom:6px;padding:2px 10px;border-radius:6px;background:var(--accent);color:#fff;font-size:13px;font-weight:800}
  .concl-eq{display:inline-block;margin-top:6px;font-size:24px;font-weight:800;color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">아레스 4 프로젝트</div>
    <h1>기체 반응 법칙</h1>
  </header>

  <div class="story">
    워트니는 화학 반응으로 산소와 비료를 만들었고, 수소와 산소를 반응시켜 생긴 <b>수증기를 식혀 액화시켜 물</b>을 얻었다. 그런데 기체들 사이엔 숨겨진 규칙이 하나 있다 —
    <b>같은 온도, 같은 압력</b>이라면 <b>같은 부피 안에는 항상 같은 개수의 분자</b>가 들어있다는 것이다.
    그래서 기체가 반응할 때 부피를 재보면 언제나 딱 떨어지는 <b>정수비</b>로 나타난다. 단계를 거치며 그 비율을 직접 찾아보자.
  </div>

  <div class="missions" id="missions"></div>

  <div class="gasbox" id="stageArea"></div>
  <div id="assessArea"></div>

</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbzdapQzEDTejuSgrpX39izgCwxvljDXmRUeaXmB9tmqHU6OMQYsE0veCUhX02SVmHE/exec';
  function submitToSheet(sim, record, onDone){
    var done = false;
    var timer = setTimeout(function(){
      if(done) return;
      done = true;
      onDone(false, true);
    }, 8000);
    try{
      var payload = Object.assign({sim: sim}, record);
      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      }).then(function(){
        if(done) return;
        done = true;
        clearTimeout(timer);
        onDone(true, false);
      }).catch(function(){
        if(done) return;
        done = true;
        clearTimeout(timer);
        onDone(false, false);
      });
    } catch(e){
      if(!done){
        done = true;
        clearTimeout(timer);
        onDone(false, false);
      }
    }
  }
(function(){
  "use strict";

  var STAGES = [
    { key:'practice', label:'연습', sub:'수소 + 염소', kind:'counter',
      eq:'H₂ + Cl₂ → 2HCl',
      steps:[{g:0,n:1},{g:1,n:2},{g:2,n:6}],
      subs:[
        {name:'수소', atoms:['H','H'], target:1},
        {name:'염소', atoms:['Cl','Cl'], target:1},
        {name:'염화수소', atoms:['H','Cl'], target:2, max:6}
      ]
    },
    { key:'basic', label:'기본', sub:'질소 + 수소', kind:'threestep',
      intro:'질소 기체와 수소 기체가 반응해서 암모니아가 만들어져요.',
      korTarget:['질소','수소','암모니아'],
      formTarget:['N₂','H₂','NH₃'],
      coefTarget:[1,3,2],
      atomsTarget:[['N','N'],['H','H'],['N','H','H','H']],
      eqSuffix:['N₂','H₂','NH₃'],
      finalEq:'N₂ + 3H₂ → 2NH₃'
    },
    { key:'basic2', label:'기본2', sub:'수소 + 산소', kind:'threestep',
      intro:'수소 기체와 산소 기체가 반응해서 수증기가 만들어져요.',
      korTarget:['수소','산소','수증기'],
      formTarget:['H₂','O₂','H₂O'],
      coefTarget:[2,1,2],
      atomsTarget:[['H','H'],['O','O'],['O','H','H']],
      eqSuffix:['H₂','O₂','H₂O'],
      finalEq:'2H₂ + O₂ → 2H₂O'
    },
    { key:'adv', label:'형성평가', sub:'', kind:'advscenario', assess:true }
  ];

  var els = {
    missions: document.getElementById('missions'),
    stageArea: document.getElementById('stageArea'),
    assessArea: document.getElementById('assessArea')
  };

  var state = { si: 0 };
  var stageDone = {};

  var practiceState = { step:0, counts:[1,0,0], results:[] };
  var basicState = { counts:[0,0,0] };
  var threeStepStates = {};
  function getThreeStepState(key){
    if(!threeStepStates[key]) threeStepStates[key] = { kor:['','',''], formula:['','',''], coef:['','',''] };
    return threeStepStates[key];
  }
  var advState = { s1:{h2:'',h2o:''}, s2:{o2:'',h2o:''}, ratio:{h2:'',o2:'',h2o:''}, def:['',''], law:['','','',''] };
  var LAW_DEF_TARGETS = [['부피'], ['정수비','정수 비']];
  var LAW_TARGETS = [['온도'], ['압력'], ['부피'], ['개수','수']];
  var assessState = { classNum:'', sid:'' };


  var ATOM_COLOR = { H:'#f8fafc', O:'#ef4444', N:'#3b82f6', Cl:'#22c55e' };
  var COMP_LAYOUT = {
    'H2O1': [[0,-8],[-21,8],[21,8]],       // 물: O가 중심, H 두 개가 굽은 각도로 결합
    'H3N1': [[0,-8],[28,4],[0,22],[-28,4]] // 암모니아: N이 중심, H 세 개가 부채꼴로 결합
  };

  function esc(s){ var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }

  // ---- 화학식 입력칸에서 바로 아래첨자 변환 (화학 반응식 만들기와 같은 방식) ----
  var G_SUB_MAP = {'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
  var G_DIGIT_TO_SUB = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉'};
  var G_SINGLE_EL = {H:1,B:1,C:1,N:1,O:1,F:1,P:1,S:1,K:1,V:1,Y:1,I:1,W:1,U:1};
  var G_DOUBLE_EL = {He:1,Li:1,Be:1,Ne:1,Na:1,Mg:1,Al:1,Si:1,Cl:1,Ar:1,Ca:1,Mn:1,Fe:1,Co:1,Ni:1,Cu:1,Zn:1,
    Br:1,Ag:1,Sn:1,Au:1,Hg:1,Pb:1,Ba:1,Sr:1,Cr:1,Ti:1,Pt:1,Rb:1,Cs:1};
  function smartFormula(raw){
    var s = String(raw||'').replace(/[₀-₉]/g, function(ch){ return G_SUB_MAP[ch] || ch; })
                            .replace(/[^A-Za-z0-9]/g, '');
    var out = '', i = 0;
    while(i < s.length){
      var ch = s[i];
      if(/[0-9]/.test(ch)){ out += G_DIGIT_TO_SUB[ch]; i++; continue; }
      var A = ch.toUpperCase();
      var nx = s[i+1];
      var nxIsLetter = nx && /[A-Za-z]/.test(nx);
      if(G_SINGLE_EL[A] && (!nxIsLetter || G_SINGLE_EL[nx.toUpperCase()])){ out += A; i++; continue; }
      if(nxIsLetter && G_DOUBLE_EL[A + nx.toLowerCase()]){ out += A + nx.toLowerCase(); i += 2; continue; }
      out += A; i++;
    }
    return out;
  }
  function applySmartFormula(inp){
    var raw = inp.value;
    var fixed = smartFormula(raw);
    if(fixed === raw) return fixed;
    var pos = (inp.selectionStart == null) ? raw.length : inp.selectionStart;
    var newPos = smartFormula(raw.slice(0, pos)).length;
    inp.value = fixed;
    try{ inp.setSelectionRange(newPos, newPos); }catch(e){}
    return fixed;
  }
  // 칸을 벗어날 때(Tab 포함) 화면을 다시 그려도 다음 칸으로 포커스가 이어지게 한다
  function refreshAfterBlur(e, tabDir){
    var next = e && e.relatedTarget;
    var nid = next && next.id;
    var before = {};
    [].forEach.call(document.querySelectorAll('input[id]'), function(x){ before[x.id] = 1; });
    refresh();
    var target = null;
    if(tabDir === 'fwd'){      // 방금 맞혀서 새로 열린 단계가 있으면 그 첫 칸으로
      var all = document.querySelectorAll('input[id]');
      for(var i=0;i<all.length;i++){ if(!before[all[i].id]){ target = all[i]; break; } }
    }
    if(!target && nid) target = document.getElementById(nid);
    if(target && target.focus){
      target.focus();
      try{ var L = (target.value || '').length; target.setSelectionRange(L, L); }catch(err){}
    }
  }
  function trackTab(el){
    el.addEventListener('keydown', function(ev){
      el.dataset.tab = (ev.key === 'Tab') ? (ev.shiftKey ? 'back' : 'fwd') : '';
    });
  }

  function bindFormulaLive(id, onChange){
    var el = document.getElementById(id);
    if(!el) return;
    el.setAttribute('autocapitalize','off'); el.setAttribute('autocorrect','off');
    el.setAttribute('autocomplete','off'); el.setAttribute('spellcheck','false');
    var timer = null;
    function scheduleRefresh(){
      if(timer) clearTimeout(timer);
      timer = setTimeout(function(){ timer = null; preserveFocus(refresh); }, 600);
    }
    el.addEventListener('compositionstart', function(){
      el.dataset.composing = '1';
      if(timer){ clearTimeout(timer); timer = null; }
    });
    el.addEventListener('compositionend', function(){
      el.dataset.composing = '';
      onChange(applySmartFormula(el));
      scheduleRefresh();
    });
    el.addEventListener('input', function(e){
      if(el.dataset.composing === '1' || e.isComposing){ onChange(el.value); return; }
      onChange(applySmartFormula(el));
      scheduleRefresh();
    });
    trackTab(el);
    el.addEventListener('blur', function(e){
      if(timer){ clearTimeout(timer); timer = null; }
      onChange(applySmartFormula(el));
      var dir = el.dataset.tab; el.dataset.tab = '';
      refreshAfterBlur(e, dir);
    });
  }
  // 반응물끼리는 순서가 바뀌어도 정답 (생성물은 그대로)
  function sideSetMatch(inputs, answers, norm){
    var a = answers.map(norm), b = inputs.map(norm);
    if(a.length !== b.length) return false;
    for(var i=0;i<a.length;i++){
      var k = b.indexOf(a[i]);
      if(k === -1) return false;
      b.splice(k,1);
    }
    return true;
  }
  function korNormG(v){ return String(v||'').trim().replace(/\s+/g,''); }

  function normForm(raw){
    var subMap = {'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
    var s = String(raw||'').trim().split('').map(function(c){ return subMap[c] || c; }).join('');
    return s.toUpperCase().replace(/\s+/g,'');
  }

  function parseRatio(raw){
    return String(raw||'').split(/[^0-9]+/).filter(function(x){ return x!==''; }).map(Number);
  }
  function ratioMatches(raw, target){
    var nums = parseRatio(raw);
    if(nums.length !== target.length) return false;
    for(var i=0;i<nums.length;i++){ if(nums[i]!==target[i]) return false; }
    return true;
  }

  // 자유 입력 화학식 문자열 -> 원자 배열 파싱 (H, O, N, Cl만 인식)
  var ELEMENTS = ['Cl','H','O','N'];
  function parseFormula(raw){
    var subMap = {'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
    var s = String(raw||'').trim().split('').map(function(c){ return subMap[c] || c; }).join('');
    s = s.replace(/\s+/g,'');
    var i=0, atoms=[];
    while(i<s.length){
      var matched=null;
      for(var e=0;e<ELEMENTS.length;e++){
        var el=ELEMENTS[e];
        if(s.substr(i,el.length).toLowerCase()===el.toLowerCase()){ matched=el; break; }
      }
      if(!matched){ i++; continue; }
      i+=matched.length;
      var numStr='';
      while(i<s.length && /[0-9]/.test(s[i])){ numStr+=s[i]; i++; }
      var cnt = numStr ? parseInt(numStr,10) : 1;
      if(cnt<1) cnt=1;
      if(cnt>6) cnt=6;
      for(var k=0;k<cnt;k++) atoms.push(matched);
    }
    return atoms.length ? atoms : null;
  }

  // 학생이 입력한 화학식을 화학식 기재 요령(원소기호+아래첨자)에 맞게 미리보기용으로 변환
  function formulaPreviewHTML(raw){
    var subMap = {'₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9'};
    var s = String(raw||'').trim().split('').map(function(c){ return subMap[c] || c; }).join('');
    s = s.replace(/\s+/g,'');
    if(!s) return '';
    var i=0, out='';
    while(i<s.length){
      var matched=null;
      for(var e=0;e<ELEMENTS.length;e++){
        var el=ELEMENTS[e];
        if(s.substr(i,el.length).toLowerCase()===el.toLowerCase()){ matched=el; break; }
      }
      if(!matched){ out += esc(s[i]); i++; continue; }
      i+=matched.length;
      var numStr='';
      while(i<s.length && /[0-9]/.test(s[i])){ numStr+=s[i]; i++; }
      out += esc(matched);
      if(numStr && numStr !== '1'){ out += '<sub>' + esc(numStr) + '</sub>'; }
    }
    return out;
  }

  function compositionKey(atoms){
    var counts={};
    atoms.forEach(function(a){ counts[a]=(counts[a]||0)+1; });
    var keys=Object.keys(counts).sort();
    return keys.map(function(k){ return k+counts[k]; }).join('');
  }
  function orderForBond(atoms){
    if(atoms.length<=1) return atoms.slice();
    var counts={};
    atoms.forEach(function(a){ counts[a]=(counts[a]||0)+1; });
    var keys=Object.keys(counts);
    var centerEl=atoms[0];
    var singles=keys.filter(function(k){ return counts[k]===1; });
    if(keys.length>1 && singles.length===1){ centerEl=singles[0]; }
    var rest=atoms.slice();
    var idx=rest.indexOf(centerEl);
    if(idx>-1) rest.splice(idx,1);
    return [centerEl].concat(rest);
  }
  function genericRadialLayout(atoms){
    var n=atoms.length;
    if(n===1) return [[0,0]];
    if(n===2){
      var r0=(atoms[0]==='H')?13:19, r1=(atoms[1]==='H')?13:19;
      var gap=Math.round((r0+r1)*0.8);
      return [[-gap/2,0],[gap/2,0]];
    }
    var layout=[[0,0]];
    var rest=n-1, radius=24;
    for(var k=0;k<rest;k++){
      var angle=(Math.PI*2*k/rest) - Math.PI/2;
      layout.push([Math.round(Math.cos(angle)*radius), Math.round(Math.sin(angle)*radius)]);
    }
    return layout;
  }

  var CUBE_PTS = ['72,21','118.8,48','118.8,102','72,129','25.2,102','25.2,48'];
  function cubeSVG(filled, correct, atoms){
    var stroke = correct ? '#15a34a' : '#c3d0dd';
    var sw = correct ? 3 : 1.8;
    var hexPath = 'M' + CUBE_PTS.join(' L') + ' Z';
    var svg = '<svg viewBox="0 0 144 156" xmlns="http://www.w3.org/2000/svg">';
    svg += '<path d="' + hexPath + '" fill="none" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
    if(!filled || !atoms || atoms.length===0){
      svg += '<line x1="72" y1="75" x2="118.8" y2="48" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
      svg += '<line x1="72" y1="75" x2="72" y2="129" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
      svg += '<line x1="72" y1="75" x2="25.2" y2="48" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
    } else {
      var ordered = orderForBond(atoms);
      var key = compositionKey(ordered);
      var layout = COMP_LAYOUT[key] || genericRadialLayout(ordered);
      var pts = ordered.map(function(_,i){ var p=layout[i]||[0,0]; return [72+p[0], 75+p[1]]; });
      for(var bi=1; bi<pts.length; bi++){
        svg += '<line x1="' + pts[0][0] + '" y1="' + pts[0][1] + '" x2="' + pts[bi][0] + '" y2="' + pts[bi][1] + '" stroke="#5a6478" stroke-width="2"/>';
      }
      ordered.forEach(function(a, i){
        var cx = pts[i][0], cy = pts[i][1];
        var r = (a === 'H') ? 13 : 19;
        var fs = (a === 'H') ? 15 : 21;
        var textColor = (a === 'H') ? '#16202f' : '#fff';
        var color = ATOM_COLOR[a] || '#cbd5e1';
        svg += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + color + '" stroke="rgba(0,0,0,.35)" stroke-width="1.4"/>';
        svg += '<text x="' + cx + '" y="' + (cy+fs*0.35) + '" text-anchor="middle" font-size="' + fs + '" font-weight="800" fill="' + textColor + '">' + a + '</text>';
      });
    }
    svg += '</svg>';
    return svg;
  }

  // 큐브 한 칸에 항상 고정된 개수(unit)만큼 분자를 함께 그린다.
  // 같은 온도·같은 압력이면 같은 부피(큐브 한 칸)엔 항상 같은 개수의 분자가 들어있다는
  // 전제를 지키기 위해, unit은 "한 상황(같은 조건)" 안에서는 물질과 상관없이 고정값을 쓴다.
  // (다른 상황끼리는 서로 다른 unit을 써도 무방 — 조건 자체가 다른 실험이므로.)
  var UNIT_SLOTS = { 1:[[0,0]], 2:[[-22,0],[22,0]], 3:[[-20,-16],[20,-16],[0,18]] };
  var UNIT_SCALE = { 1:0.62, 2:0.56, 3:0.46 };
  function miniMoleculeSVG(cx, cy, orderedAtoms, scale){
    var key = compositionKey(orderedAtoms);
    var layout = COMP_LAYOUT[key] || genericRadialLayout(orderedAtoms);
    var pts = orderedAtoms.map(function(_,i){ var p=layout[i]||[0,0]; return [cx+p[0]*scale, cy+p[1]*scale]; });
    var parts = '';
    for(var bi=1; bi<pts.length; bi++){
      parts += '<line x1="' + pts[0][0] + '" y1="' + pts[0][1] + '" x2="' + pts[bi][0] + '" y2="' + pts[bi][1] + '" stroke="#5a6478" stroke-width="1.3"/>';
    }
    orderedAtoms.forEach(function(a, i){
      var r = ((a === 'H') ? 13 : 19) * scale;
      var fs = Math.max(((a === 'H') ? 15 : 21) * scale, 8.5);
      var textColor = (a === 'H') ? '#16202f' : '#fff';
      var color = ATOM_COLOR[a] || '#cbd5e1';
      parts += '<circle cx="' + pts[i][0] + '" cy="' + pts[i][1] + '" r="' + r + '" fill="' + color + '" stroke="rgba(0,0,0,.35)" stroke-width="1.1"/>';
      parts += '<text x="' + pts[i][0] + '" y="' + (pts[i][1]+fs*0.35) + '" text-anchor="middle" font-size="' + fs + '" font-weight="800" fill="' + textColor + '">' + a + '</text>';
    });
    return parts;
  }
  function cubeSVGUnit(molCount, atoms, correct, unit){
    unit = unit || 2;
    var stroke = correct ? '#15a34a' : '#c3d0dd';
    var sw = correct ? 3 : 1.8;
    var hexPath = 'M' + CUBE_PTS.join(' L') + ' Z';
    var svg = '<svg viewBox="0 0 144 156" xmlns="http://www.w3.org/2000/svg">';
    svg += '<path d="' + hexPath + '" fill="none" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
    if(!molCount || molCount<=0 || !atoms){
      svg += '<line x1="72" y1="75" x2="118.8" y2="48" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
      svg += '<line x1="72" y1="75" x2="72" y2="129" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
      svg += '<line x1="72" y1="75" x2="25.2" y2="48" stroke="' + stroke + '" stroke-width="' + sw + '"/>';
    } else {
      var ordered = orderForBond(atoms);
      var shown = Math.min(molCount, unit);
      var slots = UNIT_SLOTS[unit] || UNIT_SLOTS[2];
      var scale = UNIT_SCALE[unit] || 0.5;
      for(var k=0;k<shown;k++){
        svg += miniMoleculeSVG(72+slots[k][0], 75+slots[k][1], ordered, scale);
      }
    }
    svg += '</svg>';
    return svg;
  }

  function preserveFocus(fn){
    var active = document.activeElement;
    var id = active && active.id;
    var start = active && typeof active.selectionStart === 'number' ? active.selectionStart : null;
    var end = active && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;
    fn();
    if(id){
      var el = document.getElementById(id);
      if(el){
        el.focus();
        if(start !== null && el.setSelectionRange){
          try{ el.setSelectionRange(start, end); }catch(e){}
        }
      }
    }
  }

  // 한글처럼 여러 키 입력이 조합되는 언어는, 조합 직후(글자 하나가 끝날 때마다) 곧바로
  // 리렌더링(DOM 재생성)하면 다음 글자를 조합하는 도중에 입력창이 통째로 교체되면서
  // 다음 글자의 초성이 씹히는 문제가 생긴다. 그래서 타이핑이 잠시(약 0.6초) 멈추거나
  // 포커스를 벗어날 때만 리렌더링하도록 미룬다.
  function bindTextLive(id, onChange){
    var el = document.getElementById(id);
    if(!el) return;
    var timer = null;
    function scheduleRefresh(){
      if(timer) clearTimeout(timer);
      timer = setTimeout(function(){ timer = null; preserveFocus(refresh); }, 600);
    }
    el.addEventListener('compositionstart', function(){
      el.dataset.composing = '1';
      if(timer){ clearTimeout(timer); timer = null; }
    });
    el.addEventListener('compositionend', function(){
      el.dataset.composing = '';
      onChange(el.value);
      scheduleRefresh();
    });
    el.addEventListener('input', function(){
      if(el.dataset.composing === '1') return;
      onChange(el.value);
      scheduleRefresh();
    });
    trackTab(el);
    el.addEventListener('blur', function(e){
      if(timer){ clearTimeout(timer); timer = null; }
      var dir = el.dataset.tab; el.dataset.tab = '';
      refreshAfterBlur(e, dir);
    });
  }

  function cf(id, val){
    return '<input type="text" class="coefin" id="' + id + '" inputmode="numeric" maxlength="1" value="' + esc(val||'') + '">';
  }
  function wb(id, val, placeholder){
    return '<input type="text" class="forminput" id="' + id + '" placeholder="' + (placeholder||'') + '" value="' + esc(val||'') + '">';
  }
  function qNum(n){
    return '<span style="color:var(--warn);font-weight:900">' + n + '번</span>';
  }

  function lawBlank(id, val, idx, targets){
    targets = targets || LAW_TARGETS;
    var ok = targets[idx].indexOf(String(val||'').trim()) !== -1 && String(val||'').trim() !== '';
    return '<input type="text" class="forminput lawblank' + (ok?' correct':'') + '" id="' + id + '" placeholder="낱말" value="' + esc(val||'') + '">';
  }
  function fgi(id, val){
    return '<span class="formgrp"><input type="text" class="forminput" id="' + id + '" placeholder="화학식" value="' + esc(val||'') + '"></span>';
  }
  function formGroupHTML(id, val){
    var preview = formulaPreviewHTML(val);
    return '<span class="formgrp">' +
      '<input type="text" class="forminput" id="' + id + '" placeholder="화학식" value="' + esc(val||'') + '">' +
      '<span class="formpreview">' + (preview || '&nbsp;') + '</span>' +
    '</span>';
  }

  function buildMissions(){
    els.missions.innerHTML = STAGES.map(function(s, i){
      var check = stageDone[s.key] ? '<span class="mt-check">✓</span>' : '';
      var advCls = (s.kind==='threestep') ? ' advanced' : (s.kind==='advscenario' ? ' assesstab' : '');
      return '<div class="mtab' + (i===state.si?' on':'') + advCls + '" data-i="' + i + '">' +
        '<div class="mt">' + s.label + check + '</div>' +
        (s.sub ? '<div class="md">' + s.sub + '</div>' : '') + '</div>';
    }).join('');
    [].forEach.call(els.missions.children, function(el, i){
      el.addEventListener('click', function(){
        state.si = i;
        var kind = STAGES[i].kind;
        if(kind==='counter') practiceState = { step:0, counts:[1,0,0], results:[] };
        if(kind==='coefgiven') basicState.counts = [0,0,0];
        refresh();
      });
    });
  }

  function refresh(){
    buildMissions();
    var s = STAGES[state.si];
    els.stageArea.className = s.assess ? 'assess' : 'gasbox';
    els.assessArea.className = '';
    els.assessArea.innerHTML = '';
    if(s.kind==='counter') renderCounter(s);
    else if(s.kind==='coefgiven') renderCoefGiven(s);
    else if(s.kind==='threestep') renderThreeStep(s);
    else if(s.kind==='advscenario') renderAdvScenario(s);
  }

  // ================= [연습] =================
  var CONDITION_NOTE = '<div style="font-size:14px;color:var(--faint);text-align:center;margin-bottom:14px">※ 모든 실험은 같은 온도, 같은 압력에서 이루어져요.</div>';

  function renderCounter(s){
    var P = practiceState;
    var stepDef = s.steps[P.step];
    var g = stepDef.g;
    var counts = P.counts;
    var tg = s.subs.map(function(x){ return x.target; });
    var k = stepDef.n / tg[g];
    var expected = tg.map(function(t){ return t * k; });
    var allCorrect = counts.every(function(c,i){ return c === expected[i]; });
    var last = P.step === s.steps.length - 1;

    var chips = s.steps.map(function(st, i){
      var cls = 'pstep' + (i < P.step || (i === P.step && allCorrect) ? ' done' : '') + (i === P.step ? ' now' : '');
      return '<span class="' + cls + '">문제 ' + (i+1) + ((i < P.step || (i === P.step && allCorrect)) ? ' ✓' : '') + '</span>';
    }).join('');

    var html = CONDITION_NOTE + '<div class="pstepbar">' + chips + '</div>';
    html += '<div class="pprompt"><b>' + s.subs[g].name + ' 기체 ' + stepDef.n + '개</b>가 주어졌어요.<br>' +
            '나머지 기체는 각각 몇 개일 때 남거나 모자라지 않고 정확히 반응할까요?</div>';

    html += '<div class="subrow">' + s.subs.map(function(sub, i){
      var boxes = '';
      var max = sub.max || 3;
      for(var b=0;b<max;b++){
        var filled = b < counts[i];
        boxes += '<div class="vbox">' + cubeSVG(filled, allCorrect && filled, sub.atoms) + '</div>';
      }
      var control = (i === g) ?
        '<div class="givenTag">주어진 기체 · ' + counts[i] + '개</div>' :
        '<div class="counter">' +
          '<button type="button" class="minus" data-i="' + i + '"' + (counts[i]<=0?' disabled':'') + '>−</button>' +
          '<span class="cval">' + counts[i] + '</span>' +
          '<button type="button" class="plus" data-i="' + i + '"' + (counts[i]>=max?' disabled':'') + '>+</button>' +
        '</div>';
      return '<div class="subcol' + (allCorrect?' correct':'') + (i===g?' given':'') + '">' +
        '<div class="snm">' + sub.name + '</div>' + control +
        '<div class="boxrow' + (max > 3 ? ' two' : '') + '">' + boxes + '</div>' +
      '</div>';
    }).join('') + '</div>';

    var ratio = expected.join(' : ');
    if(!allCorrect){
      html += '<div class="gasnote">칸을 채워 반응이 일어나는 정확한 개수를 찾아보세요.</div>';
    } else if(!last){
      html += '<div class="gasnote show-correct"><b>정확해요!</b> 수소 : 염소 : 염화수소 = ' + ratio + '</div>' +
              '<div style="text-align:center"><button type="button" class="nextbtn" id="practiceNext">다음 문제 →</button></div>';
    } else {
      var rows = P.results.slice(0, P.step).concat([ratio]);
      html += '<div class="gasnote show-correct"><b>정확해요!</b> 수소 : 염소 : 염화수소 = ' + ratio + '</div>' +
        '<div class="concl"><div class="concl-tag">결론</div>' +
          '수소 : 염소 : 염화수소 =<br><b>' + rows.join('</b> , <b>') + '</b><br>' +
          '기체의 개수는 달라도 <b>비는 항상 같아요.</b><br>' +
          '그래서 화학 반응식은 <b>가장 간단한 정수비</b>(' + tg.join(' : ') + ')로 나타내요<br>' +
          '<span class="concl-eq">' + s.eq + '</span></div>';
    }

    els.stageArea.innerHTML = html;
    if(allCorrect && last && !stageDone[s.key]){ stageDone[s.key] = true; buildMissions(); }

    [].forEach.call(els.stageArea.querySelectorAll('.plus'), function(btn){
      btn.addEventListener('click', function(){
        var i = +btn.dataset.i;
        if(counts[i] < (s.subs[i].max || 3)){ counts[i]++; refresh(); }
      });
    });
    [].forEach.call(els.stageArea.querySelectorAll('.minus'), function(btn){
      btn.addEventListener('click', function(){
        var i = +btn.dataset.i;
        if(counts[i] > 0){ counts[i]--; refresh(); }
      });
    });
    var nb = document.getElementById('practiceNext');
    if(nb) nb.addEventListener('click', function(){
      P.results[P.step] = ratio;
      P.step++;
      P.counts = [0,0,0];
      P.counts[s.steps[P.step].g] = s.steps[P.step].n;
      refresh();
    });
  }

  // ================= [기본] =================
  function renderCoefGiven(s){
    var counts = basicState.counts;
    var target = s.subs.map(function(x){ return x.target; });
    var allCorrect = counts.every(function(c,i){ return c === target[i]; });

    var html = CONDITION_NOTE + '<div class="eqline">' +
      cf('cg0', counts[0]) + ' ' + s.eqParts[0] +
      ' <span class="arrow">+</span> ' +
      cf('cg1', counts[1]) + ' ' + s.eqParts[1] +
      ' <span class="arrow">→</span> ' +
      cf('cg2', counts[2]) + ' ' + s.eqParts[2] +
      '</div>';

    html += '<div class="subrow">' + s.subs.map(function(sub, i){
      var boxes = '';
      for(var b=0;b<3;b++){
        var filled = b < counts[i];
        boxes += '<div class="vbox">' + cubeSVG(filled, allCorrect && filled, sub.atoms) + '</div>';
      }
      return '<div class="subcol' + (allCorrect?' correct':'') + '">' +
        '<div class="snm">' + sub.name + '</div>' +
        '<div class="boxrow">' + boxes + '</div>' +
      '</div>';
    }).join('') + '</div>';

    html += '<div class="gasnote' + (allCorrect?' show-correct':'') + '">' + (allCorrect ?
      ('<b>정확해요!</b> 계수비 ' + target.join(' : ') + ' 를 찾았어요.') :
      '계수를 입력해서 반응이 일어나는 정확한 비율을 찾아보세요.') + '</div>';

    els.stageArea.innerHTML = html;
    if(allCorrect) stageDone[s.key] = true;

    [0,1,2].forEach(function(i){
      var inp = document.getElementById('cg'+i);
      if(!inp) return;
      inp.addEventListener('input', function(){
        var v = parseInt(inp.value.replace(/[^0-9]/g,''), 10);
        if(isNaN(v)) v = 0;
        if(v > 9) v = 9;
        counts[i] = v;
        preserveFocus(refresh);
      });
    });
  }

  // ================= [기본2/기본3] 3단계로 반응식 완성 =================
  function renderThreeStep(s){
    var st = getThreeStepState(s.key);
    var p = s.key + '_'; // input id 접두어 (두 개의 3단계 스테이지가 서로 섞이지 않도록)
    // 반응물 두 칸은 순서가 바뀌어도 인정, 생성물 칸은 그대로
    var korOk = sideSetMatch(st.kor.slice(0,2), s.korTarget.slice(0,2), korNormG) && korNormG(st.kor[2]) === s.korTarget[2];
    var formOk = korOk && sideSetMatch(st.formula.slice(0,2), s.formTarget.slice(0,2), normForm) && normForm(st.formula[2]) === normForm(s.formTarget[2]);
    // 학생이 쓴 반응물 순서(2단계 기준)에 맞춰 3단계 계수·그림 순서를 정함
    var perm = [0,1,2];
    if(formOk){
      perm = [0,1].map(function(j){
        return normForm(st.formula[j]) === normForm(s.formTarget[0]) ? 0 : 1;
      }).concat([2]);
    }
    var coefOk = formOk && st.coef.every(function(v,j){ return (+v) === s.coefTarget[perm[j]]; });
    var finalText = [0,1].map(function(j){ var c = s.coefTarget[perm[j]]; return (c===1?'':c) + s.eqSuffix[perm[j]]; }).join(' + ') +
                    ' → ' + (s.coefTarget[2]===1?'':s.coefTarget[2]) + s.eqSuffix[2];

    var html = CONDITION_NOTE + '<div class="gasnote" style="text-align:left;margin-top:0">' + s.intro + '</div>';

    html += '<div class="q" style="margin-top:20px"><label>1단계. 우리말로 화학 반응식을 만들어보세요.</label>' +
      '<div class="eqline">' + wb(p+'t1_0', st.kor[0], '반응물 1') + ' <span class="arrow">+</span> ' +
      wb(p+'t1_1', st.kor[1], '반응물 2') + ' <span class="arrow">→</span> ' + wb(p+'t1_2', st.kor[2], '생성물') + '</div>' +
      (korOk ? '<div class="gasnote show-correct" style="margin-top:8px"><b>정확해요!</b></div>' : '') +
    '</div>';

    if(korOk){
      html += '<div class="q"><label>2단계. 우리말을 화학식으로 바꿔보세요.</label>' +
        '<div class="eqline">' + fgi(p+'t2_0', st.formula[0]) + ' <span class="arrow">+</span> ' +
        fgi(p+'t2_1', st.formula[1]) + ' <span class="arrow">→</span> ' + fgi(p+'t2_2', st.formula[2]) + '</div>';
      html += '<div class="subrow">' + [0,1,2].map(function(i){
        var atoms = parseFormula(st.formula[i]);
        var nf = normForm(st.formula[i]);
        var slotOk = !!atoms && (i === 2 ? nf === normForm(s.formTarget[2]) :
          ((nf === normForm(s.formTarget[0]) || nf === normForm(s.formTarget[1])) && (i === 0 || nf !== normForm(st.formula[0]))));
        return '<div class="subcol' + (slotOk?' correct':'') + '" style="max-width:180px">' +
          '<div class="boxrow"><div class="vbox">' + cubeSVG(!!atoms, slotOk, atoms) + '</div></div>' +
        '</div>';
      }).join('') + '</div>';
      html += '<div class="gasnote' + (formOk?' show-correct':'') + '" style="margin-top:8px">' +
        (formOk ? '<b>정확해요!</b>' : '화학식을 쓰면 아래 큐브에 분자 모양이 나타나요.') + '</div>';
    }

    if(formOk){
      html += '<div class="q"><label>3단계. 계수를 맞춰 넣어보세요.</label>' +
        '<div class="eqline">' + cf(p+'t3_0', st.coef[0]) + ' ' + s.eqSuffix[perm[0]] + ' + ' + cf(p+'t3_1', st.coef[1]) + ' ' + s.eqSuffix[perm[1]] + ' → ' + cf(p+'t3_2', st.coef[2]) + ' ' + s.eqSuffix[2] + '</div>';
      html += '<div class="subrow">' + [0,1,2].map(function(i){
        var n = Math.min(+st.coef[i] || 0, 3);
        var boxes = '';
        for(var b=0;b<3;b++){
          boxes += '<div class="vbox">' + cubeSVG(b<n, coefOk && b<n, s.atomsTarget[perm[i]]) + '</div>';
        }
        return '<div class="subcol' + (coefOk?' correct':'') + '"><div class="boxrow">' + boxes + '</div></div>';
      }).join('') + '</div>';
      html += '<div class="gasnote' + (coefOk?' show-correct':'') + '" style="margin-top:8px">' +
        (coefOk ? '<b>정확해요!</b> 완성한 반응식: ' + finalText : '계수를 입력해서 정확한 비율을 맞춰보세요.') + '</div>';
    }

    els.stageArea.innerHTML = html;
    if(coefOk) stageDone[s.key] = true;

    [0,1,2].forEach(function(i){
      bindTextLive(p+'t1_'+i, function(v){ st.kor[i]=v; });
    });
    [0,1,2].forEach(function(i){
      bindFormulaLive(p+'t2_'+i, function(v){ st.formula[i]=v; });
    });
    [0,1,2].forEach(function(i){
      var el = document.getElementById(p+'t3_'+i);
      if(el) el.addEventListener('input', function(){
        st.coef[i] = el.value.replace(/[^0-9]/g,'').slice(0,1);
        preserveFocus(function(){ el.value = st.coef[i]; refresh(); });
      });
    });
  }

  // ================= [심화] 분자 개수가 주어지면? =================
  // 같은 온도·같은 압력에서는 큐브 한 칸(같은 부피)에 항상 같은 개수(UNIT_PER_CUBE=2)의
  // 분자가 들어있다고 약속한다. 물질과 상관없이 이 숫자를 고정해야 "같은 부피엔 같은 개수"
  // 라는 전제가 지켜진다. 필요한 총 분자 수만큼 큐브 칸의 개수를 늘려서 나타낸다.
  function scenarioBlock(columns, unit){
    unit = unit || 2;
    var boxesHTML = columns.map(function(col){
      var n = col.given != null ? col.given : (+col.value || 0);
      var cubeCount = Math.max(Math.ceil(n / unit), n>0?1:0);
      var boxes = '';
      for(var c=0;c<Math.max(cubeCount,1);c++){
        var molInThis = Math.min(unit, n - c*unit);
        boxes += '<div class="vbox-fixed">' + cubeSVGUnit(molInThis, col.atoms, col.ok, unit) + '</div>';
      }
      return '<div class="subcol' + (col.ok?' correct':'') + '" style="max-width:320px">' +
        '<div class="snm">' + col.label + (col.given!=null ? ' <span style="color:var(--info)">(주어짐)</span>' : '') + '</div>' +
        '<div class="boxrow" style="flex-wrap:wrap;justify-content:center">' + boxes + '</div>' +
        '<div style="margin-top:8px;font-size:15px;color:var(--dim)">' + (n>0 ? (n+'개') : '') + '</div>' +
      '</div>';
    }).join('');
    return '<div class="subrow">' + boxesHTML + '</div>';
  }

  function renderAdvScenario(s){
    var st = advState;
    var s1h2Ok = (st.s1.h2!=='' && +st.s1.h2===4);
    var s1h2oOk = (st.s1.h2o!=='' && +st.s1.h2o===4);
    var s1Ok = s1h2Ok && s1h2oOk;
    var s2o2Ok = (st.s2.o2!=='' && +st.s2.o2===3);
    var s2h2oOk = (st.s2.h2o!=='' && +st.s2.h2o===6);
    var s2Ok = s2o2Ok && s2h2oOk;
    var idOk = !!assessState.classNum && !!assessState.sid;

    var html = '<div class="assess-tag">형성평가</div>';

    html += '<div class="idbar">' +
        '<label for="faClassNum">반</label><select id="faClassNum">' +
          '<option value="">선택</option>' +
          [1,2,3,4].map(function(n){ return '<option value="'+n+'"'+(assessState.classNum===String(n)?' selected':'')+'>'+n+'반</option>'; }).join('') +
        '</select>' +
        '<label for="faSid">번호</label><input type="text" id="faSid" placeholder="예: 15" inputmode="numeric" autocomplete="off" value="' + esc(assessState.sid) + '">' +
      '</div>' +
      '<div class="privacy-note">※ 반과 번호를 먼저 입력하고 아래 문제를 풀어주세요. 제출한 내용은 선생님이 확인할 수 있어요.</div>';

    html += '<div class="gasnote" style="text-align:left;margin-top:0">' +
      '워트니가 수증기를 만드는 실험을 두 번 반복했어요. 매번 넣는 기체의 양은 달랐지만, 결과에는 공통점이 있어요. 무엇인지 찾아볼까요?</div>';

    html += '<div class="q" style="margin-top:20px"><label>' + qNum(1) + '. 산소(O₂) 2개로 수증기를 만들었어요. 수소는 몇 개 필요했고, 수증기는 몇 개 만들어졌을까요?</label>' +
      '<div class="eqline">' + cf('s1_h2', st.s1.h2) + ' H₂ + 2 O₂ → ' + cf('s1_h2o', st.s1.h2o) + ' H₂O</div>' +
      scenarioBlock([
        {label:'수소', atoms:['H','H'], value:st.s1.h2, ok:s1h2Ok},
        {label:'산소', atoms:['O','O'], given:2, ok:true},
        {label:'수증기', atoms:['O','H','H'], value:st.s1.h2o, ok:s1h2oOk}
      ], 2) +
      '<div class="gasnote' + (s1Ok?' show-correct':'') + '" style="margin-top:8px">' +
      (s1Ok ? '<b>정확해요!</b>' : '산소가 2개일 때 필요한 수소·수증기 분자 개수를 찾아보세요.') + '</div>' +
    '</div>';

    html += '<div class="q"><label>' + qNum(2) + '. 수소(H₂) 6개로 다시 실험했어요. 산소는 몇 개 필요했고, 수증기는 몇 개 만들어졌을까요?</label>' +
      '<div class="eqline">6 H₂ + ' + cf('s2_o2', st.s2.o2) + ' O₂ → ' + cf('s2_h2o', st.s2.h2o) + ' H₂O</div>' +
      scenarioBlock([
        {label:'수소', atoms:['H','H'], given:6, ok:true},
        {label:'산소', atoms:['O','O'], value:st.s2.o2, ok:s2o2Ok},
        {label:'수증기', atoms:['O','H','H'], value:st.s2.h2o, ok:s2h2oOk}
      ], 3) +
      '<div class="gasnote' + (s2Ok?' show-correct':'') + '" style="margin-top:8px">' +
      (s2Ok ? '<b>정확해요!</b>' : '수소가 6개일 때 필요한 산소·수증기 분자 개수를 찾아보세요.') + '</div>' +
    '</div>';

    var ratioOk = s1Ok && s2Ok && (+st.ratio.h2===2 && +st.ratio.o2===1 && +st.ratio.h2o===2);

    if(s1Ok && s2Ok){
      html += '<div class="q"><label>' + qNum(3) + '. 두 실험은 사실 같은 반응이 다른 양으로 일어난 것뿐이에요. 공통으로 나타나는 비율을 H₂ : O₂ : H₂O로 써보세요.</label>' +
        '<div class="eqline">H₂ : O₂ : H₂O = ' + cf('ratio_h2', st.ratio.h2) + ' : ' + cf('ratio_o2', st.ratio.o2) + ' : ' + cf('ratio_h2o', st.ratio.h2o) + '</div>' +
        (ratioOk ? '<div class="gasnote show-correct" style="margin-top:8px"><b>정확해요!</b> 분자 개수는 달랐지만 결국 같은 비율로 귀결돼요.</div>' : '') +
      '</div>';
    }

    var defOk = ratioOk && st.def.every(function(v, i){
      var val = String(v||'').trim();
      return LAW_DEF_TARGETS[i].indexOf(val) !== -1;
    });

    if(ratioOk){
      html += '<div class="q"><label>' + qNum(4) + '. 아래 글을 읽고, 빈칸을 채워 <span class="emph-red">기체 반응 법칙</span>의 <span class="lawword-def">정의</span>를 완성하세요.</label>' +
        '<div class="readbox"><span class="rb-tag">읽어보기</span><br>' +
        '1808년, 프랑스 과학자 게이뤼삭은 기체가 반응할 때 부피를 재는 실험을 거듭한 끝에, 반응하는 기체와 생성되는 기체의 부피 사이에 항상 간단한 정수비가 성립한다는 사실을 발견했어요. 당시엔 분자의 존재도, "같은 부피엔 같은 개수의 분자가 있다"는 사실도 몰랐어요 — 그건 몇 년 뒤 아보가드로가 설명했죠. 게이뤼삭은 그저 부피를 실제로 재서 이 규칙을 찾아냈을 뿐이에요.</div>' +
        '<div class="lawbox"><span class="emph-red">기체 반응 법칙</span>은, 기체가 반응할 때 같은 온도·같은 압력에서 반응하는 기체와 생성되는 기체의 ' +
          lawBlank('def0', st.def[0], 0, LAW_DEF_TARGETS) + ' 사이에 간단한 ' + lawBlank('def1', st.def[1], 1, LAW_DEF_TARGETS) + '가 성립한다는 법칙이다.</div>' +
        '<div class="gasnote' + (defOk?' show-correct':'') + '" style="margin-top:8px">' +
        (defOk ? '<b>정확해요!</b>' : '빈칸에 알맞은 말을 써보세요.') + '</div>' +
      '</div>';
    }

    var lawOk = defOk && st.law.every(function(v, i){
      var val = String(v||'').trim();
      return LAW_TARGETS[i].indexOf(val) !== -1;
    });
    var allOk = lawOk && idOk;

    if(defOk){
      html += '<div class="q"><label>' + qNum(5) + '. 왜 부피비가 늘 정수비로 나올까요? 빈칸을 채워 <span class="lawword-reason">근거</span>를 완성하세요.</label>' +
        '<div class="lawbox">' +
          '<span class="lawword">같은</span> ' + lawBlank('law0', st.law[0], 0) + ' 와 <span class="lawword">같은</span> ' + lawBlank('law1', st.law[1], 1) +
          ' 에서는,<br><span class="lawword">같은</span> ' + lawBlank('law2', st.law[2], 2) + ' 속에는 항상 <span class="lawword">같은</span> ' + lawBlank('law3', st.law[3], 3) + ' 의 분자가 들어있다.' +
        '</div>' +
        '<div class="gasnote' + (lawOk?' show-correct':'') + '" style="margin-top:8px">' +
        (lawOk ? '<b>정확해요!</b> 이 문장이 오늘 확인한 내용의 핵심이에요.' : '빈칸에 알맞은 말을 써보세요. 맞는 칸은 초록색으로 바뀌어요.') + '</div>' +
      '</div>';
    }

    if(lawOk){
      html += '<button class="done-btn" id="submitBtn"' + (allOk?'':' disabled') + '>제출하기</button>' +
        '<div class="tstatus" id="submitStatus"></div>';
    }

    els.stageArea.innerHTML = html;
    if(allOk) stageDone[s.key] = true;

    function bindCoef(id, setter){
      var el = document.getElementById(id);
      if(!el) return;
      el.addEventListener('input', function(){
        setter(el.value.replace(/[^0-9]/g,'').slice(0,1));
        preserveFocus(function(){ el.value = el.value.replace(/[^0-9]/g,'').slice(0,1); refresh(); });
      });
    }
    bindCoef('s1_h2', function(v){ st.s1.h2=v; });
    bindCoef('s1_h2o', function(v){ st.s1.h2o=v; });
    bindCoef('s2_o2', function(v){ st.s2.o2=v; });
    bindCoef('s2_h2o', function(v){ st.s2.h2o=v; });
    bindCoef('ratio_h2', function(v){ st.ratio.h2=v; });
    bindCoef('ratio_o2', function(v){ st.ratio.o2=v; });
    bindCoef('ratio_h2o', function(v){ st.ratio.h2o=v; });

    [0,1].forEach(function(i){
      bindTextLive('def'+i, function(v){ st.def[i]=v; });
    });
    [0,1,2,3].forEach(function(i){
      bindTextLive('law'+i, function(v){ st.law[i]=v; });
    });

    var classSel = document.getElementById('faClassNum');
    if(classSel) classSel.addEventListener('change', function(){ assessState.classNum = classSel.value; refresh(); });
    var sidEl = document.getElementById('faSid');
    if(sidEl) sidEl.addEventListener('input', function(){
      assessState.sid = String(sidEl.value||'').trim().replace(/[\s\/\\'"]/g,'');
      preserveFocus(refresh);
    });

    var submitBtn = document.getElementById('submitBtn');
    if(submitBtn){
      submitBtn.addEventListener('click', function(){
        if(!allOk) return;
        submitBtn.disabled = true;
        submitBtn.textContent = '제출 중...';
        var record = {
          classNum: assessState.classNum, studentId: assessState.sid,
          scen1: st.s1.h2 + ':' + st.s1.h2o,
          scen2: st.s2.o2 + ':' + st.s2.h2o,
          ratio: st.ratio.h2 + ':' + st.ratio.o2 + ':' + st.ratio.h2o,
          def: st.def.join(' / '),
          law: st.law.join(' / '),
          ts: new Date().toISOString()
        };
        var statusEl = document.getElementById('submitStatus');
        function showStatus(msg, ok){
          if(!statusEl) return;
          statusEl.textContent = msg;
          statusEl.className = 'tstatus show ' + (ok ? 'ok' : 'err');
        }
        function resetBtn(){
          submitBtn.disabled = false;
          submitBtn.textContent = '제출하기';
        }
        submitToSheet('gaslaw2', record, function(ok, timedOut){
          resetBtn();
          if(ok){
            showStatus('제출 완료! 채점 결과: 5문항 모두 정답이에요. (다시 제출하면 이전 내용을 덮어써요.)', true);
          } else if(timedOut){
            showStatus('응답이 없어요. 인터넷 연결을 확인하고 다시 시도해주세요.', false);
          } else {
            showStatus('제출에 실패했어요. 네트워크를 확인하고 다시 시도해주세요.', false);
          }
        });
      });
    }
  }

  refresh();

})();
</script>
<div style="text-align:center;font-size:13px;font-weight:700;color:#6b7280;padding:18px 10px 10px;">제작: 교사 이수진 · 무단 복제·재배포 금지</div>
</body>
</html>
