<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important} .casegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .casepick{display:flex;flex-direction:column;gap:4px;align-items:stretch;text-align:left;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:12px;font:inherit;color:var(--ink);font-size:14px;line-height:1.45;min-width:0}
 .casepick span{font-size:13px;color:var(--muted)}
 .casepick b{font-size:14.5px;line-height:1.4}
 .casepick.on{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 1px var(--accent)}
 @media(max-width:370px){.casegrid{grid-template-columns:1fr}}
 
/* 민이의 7×7 보너스 보드: 실제 사건의 지도와 분리한 독립 논리 퍼즐 */
.bonus-intro{border-left:4px solid var(--accent);background:var(--panel2);border-radius:9px;padding:11px 13px;line-height:1.6}
.bonus-intro p+p{margin-top:7px}
.bonus-pals{display:flex;flex-wrap:wrap;gap:7px}
.bonus-pal{border:1.5px solid var(--line);border-radius:999px;padding:7px 11px;background:var(--panel);font-size:14px;font-weight:700}
.bonus-pal.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bonus-pal.placed:not(.on){opacity:.6}
.bonus-board{display:grid;grid-template-columns:repeat(7,minmax(40px,1fr));max-width:440px;margin:0 auto;border-radius:8px;overflow:hidden}
.bonus-cell{position:relative;aspect-ratio:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 2px 2px;border-radius:0;color:var(--ink);font:inherit}
.bonus-cell.blocked::before{content:'';position:absolute;inset:0;background:color-mix(in srgb,var(--ink) 10%,transparent);pointer-events:none}
.bonus-cell.blocked::after{content:'×';position:absolute;top:1px;right:3px;color:var(--bad);font-size:12px;font-weight:800;pointer-events:none}
.bonus-cell .b-room{position:absolute;left:2px;top:1px;font-size:9px;line-height:1.1;font-weight:700;color:var(--muted)}
.bonus-cell .b-icon{position:relative;font-size:clamp(18px,5vw,27px);line-height:1;min-height:23px;display:flex;align-items:center;justify-content:center}
.bonus-cell .b-icon .mat-icon{width:37px;height:30px;max-width:100%}
.bonus-cell.occupied{box-shadow:inset 0 0 0 2.5px white}
.bonus-cell.occupied .b-token{color:#fff;font-size:clamp(10px,2.6vw,13px);font-weight:800;line-height:1.15;word-break:keep-all;text-align:center;max-width:100%;padding:1px}
.bonus-cell.occupied.gift-cell{box-shadow:inset 0 0 0 2.5px #895d14}
.bonus-cell.occupied.gift-cell .b-token{color:#4b3200}
.bonus-cell.clash{outline:3px solid var(--bad);outline-offset:-3px}
.bonus-legend{display:flex;flex-wrap:wrap;gap:9px 14px;color:var(--muted);font-size:12px;align-items:center}
.bonus-legend span{display:inline-flex;align-items:center;gap:4px}
.bonus-legend .mat-icon{width:25px;height:22px}
.bonus-chip{width:16px;height:16px;display:inline-grid;place-items:center;border-radius:4px;background:color-mix(in srgb,var(--ink) 12%,var(--panel));color:var(--bad)}
.bonus-rules{margin:0;padding-left:20px;font-size:14px;display:flex;flex-direction:column;gap:3px}
.bonus-success{text-align:center;padding:18px 12px;border:2px solid var(--ok);border-radius:12px;background:color-mix(in srgb,var(--ok) 8%,var(--panel))}
.bonus-success strong{color:var(--ok)}

</style></head><body>
<title>찜질방 탈출</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Layout: 한 열 모바일 앱. 찜질방 문 표지판(나무판 + 온도 태그)을 방 카드로, 자물쇠는 다이얼로 */
:root{
  --bg:#eef1ec; --panel:#ffffff; --panel2:#f6f8f4; --ink:#1f2a24; --muted:#5f6d65; --line:#d5ddd6;
  --accent:#b9741c; --accent-ink:#ffffff; --wood:#8a5a2b; --wood-bg:#f3e7d6;
  --hot:#d0432a; --mid:#dd7f22; --warm:#b8901a; --cool:#2f8a62; --rest:#4f6684;
  --ok:#2f8a62; --bad:#c23a2a; --soft:#fbf4e8;
  --f-display:"Black Han Sans","IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131915; --panel:#1c241f; --panel2:#222c26; --ink:#e7ede8; --muted:#a3b0a8; --line:#33403a;
  --accent:#e2a24c; --accent-ink:#1a1206; --wood:#e0b07a; --wood-bg:#2b241b;
  --hot:#f0715a; --mid:#f09d4c; --warm:#d9b445; --cool:#5cc095; --rest:#8ea6c8;
  --ok:#5cc095; --bad:#f0715a; --soft:#2a2418; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#131915; --panel:#1c241f; --panel2:#222c26; --ink:#e7ede8; --muted:#a3b0a8; --line:#33403a;
  --accent:#e2a24c; --accent-ink:#1a1206; --wood:#e0b07a; --wood-bg:#2b241b;
  --hot:#f0715a; --mid:#f09d4c; --warm:#d9b445; --cool:#5cc095; --rest:#8ea6c8;
  --ok:#5cc095; --bad:#f0715a; --soft:#2a2418; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{margin:0;text-wrap:balance}
.display{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
p{margin:0}
.lines{display:flex;flex-direction:column;gap:10px}
.stepbreak{display:block;height:3px}
strong{color:var(--accent);font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.eyebrow{font-size:12.5px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:16px}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.tabnum{font-variant-numeric:tabular-nums}

/* 표지 */
.hero{display:flex;flex-direction:column;gap:8px;padding-top:8px}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(36px,10vw,52px);line-height:1.05}
.hero .sub{color:var(--muted)}
.egg{width:64px;height:78px}

/* 상단 바 */
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.teamchip{font-family:var(--f-display);font-size:20px}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13.5px;font-family:var(--f-mono);font-weight:500}

/* 방 표지판 카드 */
.plaques{display:flex;flex-direction:column;gap:10px}
.plaque{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;
  background:var(--wood-bg);border:1.5px solid color-mix(in srgb,var(--wood) 45%,transparent);border-radius:16px 16px 16px 4px;padding:12px 14px}
.plaque .ord{font-family:var(--f-mono);font-weight:700;font-size:13px;color:var(--wood);width:28px;height:28px;border-radius:50%;border:1.5px solid var(--wood);display:grid;place-items:center}
.plaque .nm{font-family:var(--f-display);font-size:21px;line-height:1.2;color:var(--ink)}
.plaque .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;font-size:13px}
.tag{border-radius:6px;padding:1px 7px;font-weight:700;font-size:12.5px;color:#fff;background:var(--c)}
.tag.line{background:transparent;color:var(--c);border:1.5px solid var(--c)}
.plaque .state{font-size:13px;font-weight:700;color:var(--muted);text-align:right}
.plaque.locked{opacity:.5}
.plaque.solved{background:var(--panel2);border-color:var(--line)}
.plaque.solved .state{color:var(--ok)}
.plaque.next{box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 55%,transparent)}
.plaque.next .state{color:var(--accent)}
.lv{letter-spacing:2px;color:var(--wood);font-size:12px}

/* 방 화면 */
.roomhead{display:flex;flex-direction:column;gap:6px;background:var(--wood-bg);border-radius:16px 16px 16px 4px;padding:16px;border:1.5px solid color-mix(in srgb,var(--wood) 45%,transparent)}
.roomhead h2{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1.15}
.timer{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.timer .t{font-family:var(--f-mono);font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.timer .bar{height:8px;background:var(--panel2);border-radius:99px;overflow:hidden}
.timer .bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .5s linear}
.timer.warn .t{color:var(--bad)}
.restbox{background:color-mix(in srgb,var(--hot) 12%,var(--panel));border:2px solid var(--hot);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.restbox .t{font-family:var(--f-mono);font-size:30px;font-weight:700}

/* 자물쇠 */
.lockbox{background:var(--panel2);border:1.5px dashed var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.dials{display:flex;gap:8px;justify-content:center}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial button{width:52px;height:36px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel);font-size:16px}
.dial .d{width:52px;height:58px;display:grid;place-items:center;font-family:var(--f-mono);font-size:32px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:10px}
.fb{font-weight:700;text-align:center}
.fb.bad{color:var(--bad)} .fb.ok{color:var(--ok)}
.arrowpad{display:grid;grid-template-columns:repeat(4,56px);gap:8px}
.arrowpad button{height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel);font-size:24px;font-weight:700}
.seq{min-height:44px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;font-size:24px;font-weight:700}
.seq span{width:38px;height:38px;border-radius:8px;background:var(--ink);color:var(--bg);display:grid;place-items:center}

.sit{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.sit li{background:var(--panel2);border-radius:10px;padding:8px 10px;display:grid;grid-template-columns:28px 1fr;gap:6px}
.sit li b{font-family:var(--f-mono);color:var(--wood)}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top}
.tbl .num{font-family:var(--f-mono);font-weight:700;font-size:20px;letter-spacing:6px;white-space:nowrap}
.menu{display:flex;flex-direction:column;gap:8px;width:100%}
.mitem{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.mitem.on{border-color:var(--accent);background:var(--soft)}
.mitem .ck{width:24px;height:24px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700}
.mitem.on .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mitem .pr,.mitem .pt{font-family:var(--f-mono);font-size:14px}
.sum{display:flex;justify-content:space-between;width:100%;font-family:var(--f-mono);font-weight:700}
.mapwrap{width:100%;overflow-x:auto}
.mapwrap svg{display:block;margin:0 auto;max-width:100%;height:auto}

/* 영상 복원: 카드 선택 → 타임라인 → 네 자리 보안 코드 */
.traininglog{display:flex;flex-direction:column;gap:8px}
.traininglog .pick{display:flex;flex-direction:column;gap:4px;line-height:1.45}
.traininglog .pick .loghead{display:flex;gap:8px;justify-content:space-between;align-items:center;font-weight:700}
.traininglog .pick .logdata{font-size:13.5px;color:var(--muted)}
.traininglog .pick .logcode{font-family:var(--f-mono);font-size:23px;font-weight:700;letter-spacing:.12em}
.traininglog .pick.on{box-shadow:0 0 0 1px var(--accent)}
.trainingnotice{background:var(--panel2);border-left:4px solid var(--accent);padding:10px 12px;border-radius:8px}
.transport-log{display:flex;flex-direction:column;gap:5px}
.vstatus{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel2);font-size:13px}
.vcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.vcard{border:2px solid var(--line);border-radius:12px;background:var(--panel);padding:9px;display:flex;flex-direction:column;gap:5px;text-align:left;min-height:120px}
.vcard.used{opacity:.38}
.vcard .vmeta{font:700 11px var(--f-mono);color:var(--muted);display:flex;justify-content:space-between;gap:4px}
.vscreen{min-height:48px;border-radius:8px;background:linear-gradient(135deg,#364441,#202e2b);color:#fff;display:flex;align-items:center;justify-content:center;gap:4px;padding:5px;font-size:25px}
.vscreen span{font-size:16px}
.vtitle{font-size:13px;line-height:1.35;word-break:keep-all}
.vslots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.vslot{border:1.5px dashed var(--accent);border-radius:10px;background:var(--soft);padding:10px 5px;min-height:67px;text-align:center;font-size:13px;line-height:1.4}
.vslot b{display:block;font:700 15px var(--f-mono)}
.vslot.empty{border-color:var(--line);background:var(--panel2);color:var(--muted)}
.vclue{background:var(--panel2);border-radius:9px;padding:11px 12px;display:flex;flex-direction:column;gap:7px;font-size:14px}
.vclue p{margin:0}
.vsuccess{padding:10px 12px;border-radius:10px;background:color-mix(in srgb,var(--ok) 10%,var(--panel));border:1px solid var(--ok)}

/* 온정: 앞선 증거를 실제로 연결하는 최종 수사 화면 */
.case-progress{display:flex;flex-wrap:wrap;gap:7px}
.case-progress span{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:700}
.case-progress .done{border-color:var(--ok);color:var(--ok)}
.case-note{background:var(--soft);border-left:3px solid var(--accent);padding:11px 13px;border-radius:8px;font-size:14px}
.case-event-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
.case-event{display:flex;flex-direction:column;justify-content:center;min-height:76px;border:1.5px solid var(--line);border-radius:10px;padding:10px 8px;background:var(--panel);text-align:left;line-height:1.45;font-size:13px}
.case-event .case-id{font:700 12px var(--f-mono);color:var(--muted)}
.case-event.selected{background:var(--soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.case-event.placed{opacity:.58}
.case-times{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.case-slot{border:1.5px dashed var(--line);border-radius:11px;background:var(--panel2);padding:10px;text-align:left;min-height:83px;line-height:1.4}
.case-slot b{display:block;font:700 16px var(--f-mono);margin-bottom:4px}
.case-slot .case-slot-name{font-size:13px}
.case-slot.filled{background:var(--soft);border:1.5px solid var(--accent)}
.case-slot.empty .case-slot-name{color:var(--muted)}
.case-people{display:grid;grid-template-columns:1fr;gap:10px}
.case-person{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel2)}
.case-person h3{margin:0;font-size:16px}
.case-person .quote{font-size:13px;color:var(--muted);margin:6px 0 10px}
.case-choice{display:flex;flex-wrap:wrap;gap:5px;margin:5px 0 9px}
.case-choice button{font-size:12.5px;font-weight:700;border:1px solid var(--line);border-radius:8px;padding:7px 9px;background:var(--panel)}
.case-choice button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.case-field-label{font-size:12px;color:var(--muted);font-weight:700}
@media(max-width:390px){.case-event{font-size:12px;padding:8px 6px}.case-times{gap:6px}.case-slot{padding:7px}.case-choice button{font-size:12px;padding:7px 6px}}

/* 증거 카드 */
.card{background:var(--soft);border:2px solid var(--accent);border-radius:4px 14px 14px 14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.card h3{font-family:var(--f-display);font-weight:400;font-size:20px}
.card.missing{background:var(--panel2);border:1.5px dashed var(--line);color:var(--muted)}
.card .lines{gap:3px}

.suspects{display:grid;grid-template-columns:1fr;gap:8px}
.sus{display:grid;grid-template-columns:auto 1fr;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.sus .av{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-size:22px;background:var(--wood-bg);color:var(--wood)}
.sus .nm{font-weight:700}
.sus .q{font-size:14.5px;color:var(--muted)}
.sus .q .lines{gap:0}
.mark{justify-self:start;margin-top:6px;border-radius:999px;border:1.5px solid var(--line);padding:3px 10px;font-size:13px;font-weight:700;background:var(--panel2)}
.mark.s{border-color:var(--bad);color:var(--bad)} .mark.a{border-color:var(--ok);color:var(--ok)}
.cast{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.castcard{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;background:var(--panel2);border-radius:12px;padding:14px}
.castcard .head{display:flex;align-items:baseline;gap:4px 8px;flex-wrap:wrap;margin-bottom:9px}
.castcard .job{font-size:13.5px;color:var(--muted)}
.castfacts{margin:0;display:grid;gap:5px}
.castfacts .fact{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:14px;line-height:1.5}
.castfacts dt{font-weight:700;color:var(--muted)}
.castfacts dd{margin:0;min-width:0;overflow-wrap:break-word;word-break:keep-all}
.cdot{width:18px;height:18px;border-radius:50%;margin-top:5px;border:1.5px solid var(--line)}
.hints{display:flex;flex-direction:column;gap:8px}
.hintcard{background:var(--soft);border-left:3px solid var(--accent);border-radius:6px;padding:8px 12px;color:var(--ink)}
.hintcard .lines{gap:2px}
.gboard{display:grid;grid-template-columns:repeat(7,minmax(40px,1fr));gap:0;max-width:440px;margin:0 auto;border-radius:6px;overflow:hidden}
.gcell{position:relative;aspect-ratio:1;min-width:0;overflow:hidden;padding:12px 2px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);font:inherit;border-radius:0}
/* 막힌 칸은 단색의 연한 음영만 사용해 그림을 가리지 않음 */

function load(){ try{ const s=JSON.parse(localStorage.getItem(KEY)); if(s&&s.rooms) return Object.assign(fresh(), s, {openAll:false}); }catch(e){} return fresh(); }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function R(id){ return S.rooms[id] || (S.rooms[id] = {solved:false, endAt:null, restEnd:null, hint:false, dig:null, seq:[], sel:[], msg:'', msgOk:false, overDone:false}); }
const room = id => ROOMS.find(r=>r.id===id);
const route = () => (ROUTES[S.team]||[]).map(i=>ROOMS[i]);
const solvedCount = () => route().filter(r=>R(r.id).solved).length;
const nextRoom = () => route().find(r=>!R(r.id).solved);
const now = () => Date.now();
/* 학생용: 정답 및 힌트가 사전에 보이지 않도록 false를 유지 */
const REVIEW = false;
const TEACHER_ACCESS = false; /* 학생용: 검토 화면 접근 금지 */
const canOpen = id => REVIEW || S.openAll || R(id).solved || (nextRoom()&&nextRoom().id===id);
const finalOpen = () => REVIEW || S.openAll || solvedCount()===6;

/* ---------- 도우미 ---------- */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<span class="stepbreak"></span>');
const sents = t => [String(t)];
const lines = arr => `<div class="lines">${arr.flatMap(sents).map(l=>`<p>${md(l)}</p>`).join('')}</div>`;
const tx = t => lines([].concat(t));
const mmss = ms => { const t=Math.max(0,Math.ceil(ms/1000)); return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0'); };
const levelDots = n => '●'.repeat(n)+'○'.repeat(5-n);
const heatTag = r => `<span class="tag" style="--c:${HEAT[r.heat].c}">${esc(r.sign)}</span>`;
const isHot = r => false;
const arrowSym = {U:'↑',D:'↓',L:'←',R:'→'};

/* ---------- 화면 ---------- */
const app = document.getElementById('app');
function render(){
  const v = S.view;
  let h='';
  if(v==='preview' && S.teacherOk) h = viewPreview();
  else if(!S.team || v==='start') h = viewStart();
  else if(v==='map') h = viewMap();
  else if(v==='room') h = viewRoom();
  else if(v==='note') h = viewNote();
  else if(v==='final') h = viewFinal();
  else if(v==='bonus') h = viewBonus();
  h += teacherBox();
  h += `<p class="foot">말랑말랑 두뇌 트레이닝 동아리 · 제작: 교사 이수진</p>`;
  app.innerHTML = h;
  save();
}

    <div class="stats"><span class="stat" data-elapsed>⏱ ${el}</span><span class="stat">증거 ${solvedCount()}/6</span><span class="stat">힌트 ${S.hints}</span></div></div>`;
}

function timerBlock(r){
  const st=R(r.id);
  if(st.solved) return '';
  if(st.restEnd && st.restEnd>now()){
    return `<div class="restbox" role="alert"><strong style="color:var(--hot)">이 미션은 잠시 쉬어 가자</strong>
      ${lines(['물을 마시고 잠깐 쉬어.','아래 시간은 게임 속 재시도 대기시간이야. 실제 입실과는 관계없어.'])}
      <span class="t tabnum" data-rest="${r.id}">${mmss(st.restEnd-now())}</span></div>`;
  }
  if(!st.endAt){
    return `<div class="timer"><span class="eyebrow">게임 제한시간 · 실제 체류시간 아님</span><span class="t">${mmss(r.limit*1000)}</span>
      <button class="btn" data-act="enter" data-id="${r.id}">미션 시작</button></div>`;
  }
  const left = st.endAt-now(); const pct = Math.max(0,Math.min(100,left/(r.limit*10)));
  const over = left<=0;
  return `<div class="timer ${left<60000?'warn':''}" style="--c:${HEAT[r.heat].c}"><span class="eyebrow">${over?'게임 시간 초과 · 계속 도전할 수 있어':'게임 남은 시간'}</span>
    <span class="t" data-timer="${r.id}">${over?'+'+mmss(-left):mmss(left)}</span><div class="bar"><i data-bar="${r.id}" style="width:${pct}%"></i></div></div>`;
}

const HINT_TAG = ['1차 힌트','2차 힌트','3차 힌트'];
const RETRY_MS = 30000;
function tryBtn(until, act, label, extra=''){
  if(until && until>now()) return `<button class="btn" disabled>⏳ <span class="tabnum" data-retry-at="${until}">${mmss(until-now())}</span> 뒤에 다시 시도해</button>`;
  return `<button class="btn" data-act="${act}" ${extra}>${label}</button>`;
}
function hintBlock(hints, opened, startAt, delays, k){
  const st=R(S.cur);
  let h='';
  for(let i=0;i<opened;i++) h+=`<div class="hintcard"><span class="eyebrow">${HINT_TAG[i]}</span>${tx(hints[i])}</div>`;
  if(opened<hints.length){
    const at=st.hNextAt || ((st.startedAt||startAt||now())+90000);
    h+=at<=now()?`<button class="btn ghost small" data-act="hint">${HINT_TAG[opened]} 보기 (힌트 1회 사용)</button>`
      :`<button class="btn ghost small" disabled>${HINT_TAG[opened]}는 <span class="tabnum" data-hint-at="${at}">${mmss(at-now())}</span> 뒤에 열려</button>`;
  }
  return `<div class="hints">${h}</div>`;
}

function puzzleBlock(r, only1){

  } else if(r.type==='delivery' || r.type==='alibi'){
    const isAlibi=r.type==='alibi';
    const stage=isAlibi?(st.alibiStage||1):(st.deliveryStage||1);
    let wanted,got,label;
    if(isAlibi){
      wanted=stage===1?1:6;

    }

  } else if(r.type==='arrows'){

    const sel=st.sel; const cost=MENU.filter(m=>sel.includes(m.id)).reduce((a,m)=>a+m.pr,0); const pts=MENU.filter(m=>sel.includes(m.id)).reduce((a,m)=>a+m.pt,0);
    lock = `<div class="menu">${MENU.map(m=>`<button class="mitem ${sel.includes(m.id)?'on':''}" data-act="menu" data-m="${m.id}" aria-pressed="${sel.includes(m.id)}"><span class="ck">${sel.includes(m.id)?'✓':''}</span><span>${esc(m.nm)}</span><span class="pr tabnum">${m.pr.toLocaleString()}원</span><span class="pt tabnum">${m.pt}점</span></button>`).join('')}</div>
      <div class="sum tabnum"><span style="color:${cost>BUDGET?'var(--bad)':'inherit'}">${cost.toLocaleString()} / ${BUDGET.toLocaleString()}원</span><span>점수: 직접 계산</span></div>

    <div class="lockbox">${lock}${st.msg?`<div class="fb ${st.msgOk?'ok':'bad'}" role="status">${tx(st.msg)}</div>`:''}</div>

function dustAt(x,y,kind,k){
  const C=46, off=[[.28,.3],[.62,.28],[.42,.6],[.72,.66],[.24,.72]];
  return off.slice(0,3+((x+y+k)%2)).map(([a,b],i)=>{
    const cx=x*C+C*a+((i*7+x)%5)-2, cy=y*C+C*b+((i*3+y)%5)-2;
    if(kind==='ht') return `<rect x="${cx-3.6}" y="${cy-3.2}" width="7.2" height="6.4" rx="1" transform="rotate(${(i*37+x*11+y*17)%60-30} ${cx} ${cy})" fill="#c08a2e"/>`;
    if(kind==='pol') return `<circle cx="${cx}" cy="${cy}" r="3.6" fill="#c08a2e"/>`;
    return `<polygon points="${cx},${cy-4} ${cx+4},${cy+3} ${cx-4},${cy+3}" fill="#8c938f"/>`;
  }).join('');
}
function dustSample(kind){
  return `<svg viewBox="0 0 46 46" width="46" height="46" aria-hidden="true"><rect x="1" y="1" width="44" height="44" rx="8" fill="var(--panel2)" stroke="var(--line)"/>${dustAt(0,0,kind,1)}</svg>`;
}
function trailSVG(){
  const C=46, W=MAP_W*C, H=MAP_H*C, pad=4;
  let g='';
  for(let y=0;y<MAP_H;y++)for(let x=0;x<MAP_W;x++) g+=`<rect x="${x*C+2}" y="${y*C+2}" width="${C-4}" height="${C-4}" rx="7" fill="var(--panel2)" stroke="var(--line)"/>`;
  PATH.slice(1,-1).forEach(([x,y],i)=>g+=dustAt(x,y,'ht',i));
  HT_DEAD.forEach(([x,y],i)=>g+=dustAt(x,y,'ht',i+1));
  POLLEN.forEach(([x,y],i)=>g+=dustAt(x,y,'pol',i));
  STONE.forEach(([x,y],i)=>g+=dustAt(x,y,'st',i));
  const label=(x,y,t,c)=>`<rect x="${x*C+3}" y="${y*C+3}" width="${C-6}" height="${C-6}" rx="7" fill="${c}"/><text x="${x*C+C/2}" y="${y*C+C/2+5}" text-anchor="middle" font-size="12" font-weight="700" fill="#fff" font-family="IBM Plex Sans KR, sans-serif">${t}</text>`;
  g+=label(0,0,'황토방','var(--warm)')+label(8,6,'진열대','var(--accent)')+label(1,6,'수면실','var(--rest)')+label(3,6,'약돌방','var(--mid)');
  const svg=`<svg viewBox="-${pad} -${pad} ${W+pad*2} ${H+pad*2}" width="${W}" role="img" aria-label="세 종류의 가루 흔적 지도">${g}</svg>`;
  return `<div class="row" style="justify-content:center;margin-bottom:8px">${dustSample('ht')}<span class="muted" style="font-size:14px">← 진열대 위에서 발견된 가루 (확대)</span></div>${svg}`;
}

function staticPuzzle(r){
  let h = lines(r.task);
  if(r.sit) h += `<ol class="sit">${r.sit.map((s,i)=>`<li><b>${'①②③④⑤⑥⑦⑧'[i]}</b><span>${tx(s)}</span></li>`).join('')}</ol>`;
  if(r.clues) h += `<div class="mapwrap"><table class="tbl"><tbody>${r.clues.map(c=>`<tr><td class="num">${c[0]}</td><td>${md(c[1])}</td></tr>`).join('')}</tbody></table></div>`;
  if(r.type==='delivery') h += `${deliveryEvidence()}<div class="refmark">13:58 노란 가루 사진 · 14:00 황금 계란 있음 · 14:30 실종 확인</div>`;
  if(r.type==='alibi') h += `<div class="logline">복도 CCTV: 14:05 푸룬 입실 / 14:16 장난감을 들고 퇴실 / 센서: 14:09 푸룬 입실</div><div class="logline">센서: 14:04 데굴 입실 · 14:09 푸룬 입실 · 14:20 푸룬 퇴실 · 14:35 데굴 퇴실</div><div class="casegrid">${ALIBI.map(c=>`<div class="casepick">${esc(c.txt)}</div>`).join('')}</div>`;
  if(r.type==='video') h += `<div class="vclue">${VIDEO_SHUFFLE.map(id=>{const f=videoFrame(id);return `<p><b>${id}</b> · [${f.device}] ${f.title} / 화면 숫자 ${f.digit}</p>`;}).join('')}</div>`;
  if(r.type==='arrows') h += `<div class="mapwrap">${trailSVG()}</div>`;
  if(r.type==='knapsack') h += `<div class="mapwrap"><table class="tbl tabnum"><thead><tr><th>메뉴</th><th>가격</th><th>점수</th></tr></thead><tbody>${MENU.map(m=>`<tr><td>${esc(m.nm)}</td><td>${m.pr.toLocaleString()}원</td><td>${m.pt}점</td></tr>`).join('')}</tbody></table></div>`;
  return h;
}

function checkRoom(r){
  const st=R(r.id);
  let ok=false, msg='';
  if(r.type==='video'){
    if(!st.videoOK){
      ok = (st.videoSeq||[]).join(',') === VIDEO_ORDER.join(',');
      if(ok){ st.videoOK=true; st.msg='📼 영상 순서가 복원됐어! 이제 2~5번째 숫자로 보안 암호를 열어 봐.'; st.msgOk=true; return; }
      msg='영상에 다른 기기로 찍힌 장면이 있거나 순서가 틀렸어. 4가지 복원 단서를 다시 비교해.';
    } else {
      ok = enc((st.dig||[]).join(''))===r.ans;
      msg=ok?'':'영상의 2~5번째 장면에 적힌 숫자를 다시 확인해.';
    }
  }
  else if(r.type==='digits'){ ok = enc(st.dig.join(''))===r.ans; msg = ok?'':'자물쇠가 열리지 않아. 다시 생각해 봐.'; }
  else if(r.type==='arrows'){ ok = enc(st.seq.join(''))===r.ans; msg = ok?'':(st.seq.length?'흔적이 진열대까지 이어지지 않아.':'화살표를 입력해.'); }
  else if(r.type==='delivery'){
    if((st.deliveryStage||1)===1){
      const a=st.deliveryChoices||{};
      const times=DELIVERY_CARDS.map(c=>a[c.id]?.time);
      const places=DELIVERY_CARDS.map(c=>a[c.id]?.place);
      if(new Set(times).size!==4 || new Set(places).size!==4){
        msg='같은 시각이나 도착지가 두 번 사용됐어. 한 번씩만 배치해.';
      }else if(DELIVERY_CARDS.every(c=>a[c.id].time===c.time && a[c.id].place===c.place)){
        st.deliveryStage=2;st.msg='운반 기록을 복원했어. 이제 사건 전후 사진을 비교해 봐.';st.msgOk=true;st.lockUntil=null;return;
      }else{
        msg='시간 단서와 장소 단서를 다시 비교해 봐. 기록은 각각 한 번씩 사용돼.';
      }
    }else{
      const selection=(st.deliveryClaimSel||[]).slice().sort().join('|');
      ok=selection==='a|b';
      msg=ok?'':'사진에 나온 사실과, 특정 인물의 행동을 추측한 문장을 구분해 봐.';
    }
  }
  else if(r.type==='alibi'){
    if((st.alibiStage||1)===1){
      if(st.clockChoice==='fast4'){st.alibiStage=2;st.msg='시계의 차이를 확인했어. 이제 실제 시각으로 바꾸어 진술을 판단해.';st.msgOk=true;st.lockUntil=null;return;}
      msg='같은 순간이 찍힌 두 기록의 시각을 비교해 봐.';
    }else{
      ok=ALIBI.every(c=>(st.alibiVerdicts||{})[c.id]===c.answer);
      msg=ok?'':'시간 차이를 적용한 뒤, 가능한 사실과 확인된 사실을 구분해 봐.';
    }
  }
  else if(r.type==='knapsack'){
    const items=MENU.filter(m=>st.sel.includes(m.id)); const cost=items.reduce((a,m)=>a+m.pr,0), pts=items.reduce((a,m)=>a+m.pt,0);
    if(!items.length) msg='메뉴를 골라 줘.';
    else if(cost>BUDGET) msg='**예산 초과**야. 14,000원 안에서 골라 줘.';
    else if(!items.some(m=>m.drink)) msg='**음료**가 하나도 없어. 음료를 1개 이상 넣어야 해.';
    else if(pts<BEST) msg=`예산 안이지만 **${pts}점**이야. 더 높은 점수를 만들 수 있어.`;
    else ok=true;
  }
  if(ok){ st.solved=true; st.msg=REVIEW?'정답이야! 🔓':''; st.msgOk=true; st.endAt=null; st.restEnd=null; }
  else {
    const empty = (r.type==='arrows' && !st.seq.length) || (r.type==='knapsack' && !st.sel.length) || (r.type==='video' && !(st.videoSeq||[]).length) || (r.type==='delivery' && ((st.deliveryStage||1)===1?(!st.deliveryChoices||!Object.values(st.deliveryChoices).some(v=>v.time||v.place)):!(st.deliveryClaimSel||[]).length)) || (r.type==='alibi' && ((st.alibiStage||1)===1?!st.clockChoice:Object.keys(st.alibiVerdicts||{}).length===0));
    st.msg=msg; st.msgOk=false;
    if(!empty){ S.wrong++; st.lockUntil=now()+RETRY_MS; st.msg += ' 30초 뒤에 다시 시도해.'; }
  }
}
app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act; if(!a) return;
  const r = S.cur ? room(S.cur) : null; const st = r ? R(r.id) : null;
  switch(a){
    case 'team': { const keep={openAll:S.openAll, teacher:S.teacher, teacherOk:S.teacherOk}; S=Object.assign(fresh(),keep); S.team=+b.dataset.t; S.startAt=now(); S.view='map'; window.scrollTo(0,0); break; }
    case 'resume': S.view='map'; break;
    case 'home': S.view='start'; S.cur=null; window.scrollTo(0,0); break;
    case 'openon': { const v=(document.getElementById('tcode2')||{}).value||''; if(v.trim()===TEACHER){ S.openAll=true; S.teacherOk=true; S.ocmsg=''; } else S.ocmsg='코드가 맞지 않아.'; break; }
    case 'openoff': S.openAll=false; break;
    case 'open': { const id=b.dataset.id; if(canOpen(id)){ S.cur=id; S.view='room'; const o=R(id); if(!o.openedAt) o.openedAt=now(); window.scrollTo(0,0); } break; }
    case 'enter': { st.startedAt=now(); st.hNextAt=st.startedAt+90000; st.endAt=st.startedAt+r.limit*1000; st.msg=''; break; }
    case 'dup': st.dig[+b.dataset.i]=(st.dig[+b.dataset.i]+1)%10; st.msg=''; break;
    case 'ddn': st.dig[+b.dataset.i]=(st.dig[+b.dataset.i]+9)%10; st.msg=''; break;
    case 'arr': if(st.seq.length<10) st.seq.push(b.dataset.a); st.msg=''; break;
    case 'vadd': { st.videoSeq=st.videoSeq||[]; const id=b.dataset.v; if(!st.videoOK&&st.videoSeq.length<6&&!st.videoSeq.includes(id)) st.videoSeq.push(id); st.msg=''; break; }
    case 'vrm': if(!st.videoOK&&st.videoSeq) st.videoSeq.splice(+b.dataset.i,1); st.msg=''; break;
    case 'vclear': if(!st.videoOK) st.videoSeq=[]; st.msg=''; break;
    case 'back1': st.seq.pop(); st.msg=''; break;
    case 'menu': { const m=b.dataset.m; st.sel = st.sel.includes(m)?st.sel.filter(x=>x!==m):[...st.sel,m]; st.msg=''; break; }
    case 'toggleRef': st.genericRefOpen=!st.genericRefOpen; break;
    case 'deliveryRef': st.deliveryRefOpen=st.deliveryRefOpen===false; break;
    case 'alibiRef': st.alibiRefOpen=st.alibiRefOpen===false; break;
    case 'videoRef': st.videoRefOpen=!st.videoRefOpen; break;
    case 'completedRef': st.completedRefOpen=!st.completedRefOpen; break;
    case 'finalRef': S.finalRefOpen=!S.finalRefOpen; break;
    case 'deliveryclaim': {const id=b.dataset.id;st.deliveryClaimSel=st.deliveryClaimSel||[];st.deliveryClaimSel=st.deliveryClaimSel.includes(id)?st.deliveryClaimSel.filter(x=>x!==id):(st.deliveryClaimSel.length<2?[...st.deliveryClaimSel,id]:st.deliveryClaimSel);st.msg='';break;}
    case 'clock': st.clockChoice=b.dataset.val; st.msg=''; break;
    case 'averdict': { st.alibiVerdicts=st.alibiVerdicts||{}; st.alibiVerdicts[b.dataset.id]=b.dataset.val; st.msg=''; break; }
    case 'check': checkRoom(r); break;
    case 'hint': { if(!r||!st.startedAt||st.h>=r.hints.length||now()<(st.hNextAt||st.startedAt+90000)) break; st.h=(st.h||0)+1; st.hNextAt=now()+90000; S.hints++; break; }
    case 'preview': S.view='preview'; S.pteam=S.pteam||1; window.scrollTo(0,0); break;
    case 'pteam': S.pteam=+b.dataset.t; break;
    case 'pback': S.view = S.team?'map':'start'; break;
    case 'bonusOpen': {
      if(!(S.solvedFinal||TEACHER_ACCESS))break;
      if(!S.team){S.team=1;S.startAt=now();}
      S.view='bonus';S.cur=null;window.scrollTo(0,0);break;}
    case 'bonusBack': S.view=S.solvedFinal?'final':'map';window.scrollTo(0,0);break;
    case 'bonusStart': {
      if(!S.bonusStartAt){S.bonusStartAt=now();S.bonusHintNextAt=now()+90000;S.bonusPos={};S.bonusSel='minyi';S.bonusMsg='';}
      break;}
    case 'bonusSel': if(S.bonusStartAt&&!S.bonusGameDone){S.bonusSel=b.dataset.k;}break;
    case 'bonusPut': {
      if(!S.bonusStartAt||S.bonusGameDone)break;
      const rc=b.dataset.rc,obj=BONUS_OBJ[rc],pos=S.bonusPos||(S.bonusPos={});S.bonusMsg='';
      if(obj&&!obj[1]){S.bonusMsg='이 칸은 가구가 있어 배치할 수 없어.';break;}
      const here=Object.keys(pos).find(k=>pos[k]===rc);
      if(here){delete pos[here];S.bonusSel=here;break;}
      pos[S.bonusSel||'minyi']=rc;
      const next=BONUS_TOK.find(t=>!pos[t.k]);if(next)S.bonusSel=next.k;
      break;}
    case 'bonusCheck': {
      if(!S.bonusStartAt||S.bonusGameDone||S.bonusLock&&S.bonusLock>now())break;
      const pos=S.bonusPos||{};
      if(BONUS_TOK.some(t=>!pos[t.k])){S.bonusMsg='아직 배치하지 않은 인물이나 바구니가 있어.';break;}
      if(bonusConflicts(pos).size){S.bonusMsg='같은 가로줄이나 세로줄에 둘 이상 있어.';break;}
      if(enc(bonusGridKey(pos))===BONUS_ANSWER){S.bonusGameDone=now();S.bonusMsg='';}
      else{S.bonusMsg='조건에 맞지 않는 위치가 있어. 메모와 가구 그림을 다시 확인해.';S.bonusLock=now()+30000;}
      break;}
    case 'bonusHint': {
      if(!S.bonusStartAt||S.bonusGameDone||(S.bonusHints||0)>=BONUS_HINTS.length||now()<(S.bonusHintNextAt||S.bonusStartAt+90000))break;
      S.bonusHints=(S.bonusHints||0)+1;S.bonusHintNextAt=now()+90000;break;}
    case 'bonusTestReset': {
      if(!TEACHER_ACCESS)break;
      S.bonusStartAt=null;S.bonusGameDone=null;S.bonusPos={};S.bonusSel='minyi';S.bonusHints=0;S.bonusHintNextAt=null;S.bonusMsg='';S.bonusLock=null;break;}
    case 'map': S.view='map'; S.cur=null; break;
    case 'note': S.noteReturn={view:S.view,cur:S.cur}; S.view='note'; window.scrollTo(0,0); break;
    case 'noteBack': { const prev=S.noteReturn||{view:'map',cur:null}; S.view=prev.view||'map'; S.cur=prev.cur||null; window.scrollTo(0,0); break; }
    case 'final': if(finalOpen()){ S.view='final'; window.scrollTo(0,0); } break;
    case 'mark': { const id=b.dataset.s; S.marks[id]=((S.marks[id]||0)+1)%3; break; }
    case 'accuse': S.accuse=b.dataset.s; S.finalMsg=''; break;
    case 'caseEvent': {
      S.caseEventSelected=(S.caseEventSelected===b.dataset.id?null:b.dataset.id);
      S.caseTimeMsg='';break;
    }
    case 'caseSlot': {
      if(S.caseTimeDone) break;
      const time=b.dataset.time, placed=S.casePositions||{}, current=placed[time];
      if(current){delete placed[time];S.caseEventSelected=current;S.caseTimeMsg='';break;}
      const id=S.caseEventSelected;
      if(!id){S.caseTimeMsg='기록 카드를 먼저 선택해.';break;}
      for(const key of Object.keys(placed)) if(placed[key]===id) delete placed[key];
      placed[time]=id; S.casePositions=placed; S.caseEventSelected=null;S.caseTimeMsg='';break;
    }
    case 'caseClear': S.casePositions={};S.caseEventSelected=null;S.caseTimeMsg='';break;
    case 'caseCheck': {
      const placed=S.casePositions||{};
      if(FINAL_TIMES.some(t=>!placed[t])){S.caseTimeMsg='아직 비어 있는 시각이 있어.';break;}
      if(FINAL_TIMES.every(t=>FINAL_EVENTS.find(e=>e.id===placed[t])?.time===t)){
        S.caseTimeDone=true;S.caseTimeMsg='기록을 시간순으로 연결했어.';
      }else{
        S.caseTimeMsg='시각과 맞지 않는 기록이 있어. 증거를 다시 대조해 봐.';
        S.wrong++;S.caseLock=now()+RETRY_MS;
      }break;
    }
    case 'caseVerdict': {
      if(S.caseAlibiDone) break;
      S.caseVerdicts=S.caseVerdicts||{};
      const v=S.caseVerdicts[b.dataset.id]||(S.caseVerdicts[b.dataset.id]={});
      v[b.dataset.field]=b.dataset.value;S.caseAlibiMsg='';break;
    }
    case 'caseAlibiCheck': {
      if(!S.caseTimeDone)break;
      const verdicts=S.caseVerdicts||{};
      if(FINAL_SUSPECTS.some(s=>!verdicts[s.id]?.statement||!verdicts[s.id]?.can)){
        S.caseAlibiMsg='네 사람의 두 가지 판단을 모두 채워 봐.';break;
      }
      if(FINAL_SUSPECTS.every(s=>verdicts[s.id].statement===s.statement&&verdicts[s.id].can===s.can)){
        S.caseAlibiDone=true;S.caseAlibiMsg='진술과 이동 가능성을 구분했어.';
      }else{
        S.caseAlibiMsg='일부 진술이나 동선 판단이 기록과 맞지 않아. 거짓 진술과 이동 가능성을 별개로 살펴봐.';
        S.wrong++;S.caseAlibiLock=now()+RETRY_MS;
      }break;
    }
    case 'casePreview': {
      // 검토용 버튼 전용. 학생용 파일에는 버튼이 없음.
      const step=+b.dataset.step;
      if(step===1){S.caseTimeDone=false;S.caseAlibiDone=false;}
      if(step===2){S.caseTimeDone=true;S.caseAlibiDone=false;}
      if(step===3){S.caseTimeDone=true;S.caseAlibiDone=true;}
      S.caseTimeMsg='';S.caseAlibiMsg='';window.scrollTo(0,0);break;
    }
    case 'solve': {
      if(!S.caseTimeDone||!S.caseAlibiDone||!S.accuse) break;
      const s=SUSPECTS.find(x=>x.id===S.accuse);
      if(s.id!=='juju'){ S.wrong++; S.finalLock=now()+RETRY_MS; S.finalMsg=`**${s.nm}**은(는) 범인이 아니야. ${s.wrong}`; }
      else { S.solvedFinal=true; S.endAt=now(); }
      break; }
    case 'tch': S.teacher=true; break;
    case 'tclose': S.teacher=false; S.teacherOk=false; break;
    case 'tok': { const v=(document.getElementById('tcode')||{}).value||''; if(v.trim()===TEACHER) S.teacherOk=true; break; }
    case 'reset': { S = fresh(); break; }
  }
  render();
});

app.addEventListener('change', e=>{
  const t=e.target; if(!t.matches('select[data-delivery-id]')||!S.cur) return;
  const st=R(S.cur);st.deliveryChoices=st.deliveryChoices||{};
  const id=t.dataset.deliveryId,field=t.dataset.field;
  st.deliveryChoices[id]=st.deliveryChoices[id]||{};
  st.deliveryChoices[id][field]=t.value;
  st.msg='';save();render();
});

app.addEventListener('input', e=>{
  const t=e.target; if(!t.classList.contains('pin') || !S.cur) return;
  R(S.cur)[t.id]=t.value; R(S.cur).msg=''; save();
});

/* 타이머: 숫자만 갱신, 상태가 바뀔 때만 다시 그림 */
setInterval(()=>{
  let changed=false;
  ROOMS.forEach(r=>{
    const st=S.rooms[r.id]; if(!st||st.solved) return;
    if(st.endAt && st.endAt<=now()){
      if(isHot(r)){ st.endAt=null; st.restEnd=now()+r.rest*1000; changed=true; }
      else if(!st.overDone){ st.overDone=true; S.over++; changed=true; }
    }
    if(st.restEnd && st.restEnd<=now()){ st.restEnd=null; changed=true; }
  });
  ROOMS.forEach(r=>{ const st=S.rooms[r.id]; if(st&&st.pEnd&&st.pEnd<=now()){ st.pEnd=null; st.pDone=true; changed=true; } });
  document.querySelectorAll('[data-retry-at]').forEach(t=>{ const at=+t.dataset.retryAt; if(at<=now()) changed=true; else t.textContent=mmss(at-now()); });
  document.querySelectorAll('[data-hint-at]').forEach(t=>{ const at=+t.dataset.hintAt; if(at<=now()) changed=true; else t.textContent=mmss(at-now()); });
  if(changed){ render(); return; }
  document.querySelectorAll('[data-pulse]').forEach(t=>{ const st=R(t.dataset.pulse); if(st.pEnd) t.textContent=mmss(st.pEnd-now()); });
  const bonusTimer=document.querySelector('[data-bonus-elapsed]');if(bonusTimer&&S.bonusStartAt)bonusTimer.textContent=mmss(now()-S.bonusStartAt);
  const el=document.querySelector('[data-elapsed]'); if(el&&S.startAt) el.textContent='⏱ '+mmss((S.endAt||now())-S.startAt);
  document.querySelectorAll('[data-timer]').forEach(t=>{ const r=room(t.dataset.timer), st=R(r.id); if(!st.endAt) return; const left=st.endAt-now();
    t.textContent = left<=0?'+'+mmss(-left):mmss(left); t.closest('.timer').classList.toggle('warn',left<60000);
    const bar=document.querySelector(`[data-bar="${r.id}"]`); if(bar) bar.style.width=Math.max(0,Math.min(100,left/(r.limit*10)))+'%'; });
  document.querySelectorAll('[data-rest]').forEach(t=>{ const st=R(t.dataset.rest); if(st.restEnd) t.textContent=mmss(st.restEnd-now()); });
}, 500);

render();
</script>
