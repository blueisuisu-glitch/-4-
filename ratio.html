<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>일정 성분비 법칙 — 아레스 4 프로젝트</title>
<style>
  :root{
    --bg:#f1f5f9; --panel:#ffffff; --line:#d3dbe6; --line2:#e2e8f0;
    --ink:#16202f; --dim:#5a6478; --faint:#94a0b4;
    --accent:#15a34a; --accent-bg:#e7f7ee; --accent-line:#a7e0be;
    --warn:#d9670f; --warn-bg:#fdf0e4; --warn-line:#f2c79a;
    --bad:#d63c33; --bad-bg:#fdeceb; --bad-line:#f2b3ae;
    --info:#2563c9; --info-bg:#e8f0fd;
    --H:#ffffff; --O:#ef4444; --C:#475569; --N:#3b82f6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);
    font-family:'Segoe UI','Malgun Gothic',system-ui,sans-serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:1180px;margin:0 auto;padding:26px 20px 70px}
  header{margin-bottom:26px}
  .eyebrow{font-size:20px;letter-spacing:.2em;color:var(--warn);text-transform:uppercase;font-weight:800;margin-bottom:10px}
  h1{font-size:46px;font-weight:800;line-height:1.2}
  h1 .sub{display:block;font-size:25px;font-weight:500;color:var(--dim);margin-top:14px;line-height:1.55}
  h1 .sub b{color:var(--warn)}
  .story{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--warn);
    border-radius:0 16px 16px 0;padding:20px 24px;margin-bottom:22px;font-size:24px;line-height:1.6;color:var(--ink)}
  .story b{color:var(--warn)}

  .idbar{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);
    border-radius:16px;padding:18px 22px;margin-bottom:16px;flex-wrap:wrap;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .idbar label{font-size:22px;color:var(--dim);font-weight:700}
  .idbar input,.idbar select{background:#f8fafc;border:1px solid var(--line);color:var(--ink);border-radius:10px;
    padding:12px 15px;font-family:inherit;font-size:24px}
  .idbar input{width:120px}
  .idbar input:focus,.idbar select:focus{outline:none;border-color:var(--warn)}
  .savenote{font-size:19px;color:var(--faint);margin-left:auto}
  .savenote.active{color:var(--accent)}
  .privacy-note{font-size:19px;color:var(--faint);margin-bottom:22px;line-height:1.5}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:26px 28px;margin-bottom:20px;
    box-shadow:0 1px 3px rgba(20,30,50,.05)}

  .missions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .mtab{flex:1;min-width:220px;padding:20px 16px;background:var(--panel);border:2px solid var(--line);
    border-radius:16px;cursor:pointer;text-align:center;transition:.14s;box-shadow:0 1px 2px rgba(20,30,50,.04)}
  .mtab:hover{border-color:var(--warn-line);background:var(--warn-bg)}
  .mtab.on{border-color:var(--warn);background:var(--warn-bg)}
  .mtab.done{border-color:var(--accent);background:var(--accent-bg)}
  .mtab .mt{font-size:24px;font-weight:800}
  .mtab .md{font-size:19px;color:var(--dim);margin-top:5px}
  .mtab .chk{color:var(--accent);font-weight:800}

  .goal{font-size:24px;line-height:1.6;color:var(--ink);background:var(--warn-bg);border:1px solid var(--warn-line);
    border-radius:14px;padding:20px 24px;margin-bottom:22px}
  .goal b{color:var(--warn)}
  .concept{font-size:24px;line-height:1.6;color:var(--ink);background:var(--info-bg);border:1px solid #b9d3f5;
    border-radius:14px;padding:20px 24px;margin-bottom:14px}
  .concept b{color:var(--info)}
  .masscards{display:flex;gap:14px;justify-content:center;margin-bottom:20px}
  .masscard{background:#fff;border:3px solid var(--info);border-radius:16px;padding:14px 26px;text-align:center;min-width:140px}
  .masscard .msym{font-size:26px;font-weight:800;color:var(--info)}
  .masscard .mname{font-size:16px;color:var(--dim);margin-top:2px}
  .masscard .mval{font-size:44px;font-weight:800;color:var(--ink);margin-top:6px}
  .masscard .mval .u{display:block;font-size:15px;color:var(--dim);font-weight:600;margin-top:4px}

  .assess{border:3px solid var(--warn);border-radius:18px;padding:30px 24px 24px;margin-top:22px;position:relative}
  .assess-tag{position:absolute;top:-19px;left:22px;background:var(--warn);color:#fff;
    padding:7px 18px;border-radius:999px;font-weight:800;font-size:17px;letter-spacing:.03em}
  .assess .idbar{margin-top:2px}

  .stockbar{background:#f8fafc;border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px}
  .stockbar h3{font-size:21px;color:var(--dim);font-weight:700;margin-bottom:20px;text-align:center}
  .stocks{display:flex;gap:36px;justify-content:center;flex-wrap:wrap}
  .stockone{text-align:center}
  .stockone .lbl{font-size:23px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:10px;justify-content:center}
  .stockone .swatch{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(0,0,0,.25)}
  .counter{display:flex;align-items:center;gap:18px;justify-content:center}
  .counter button{width:76px;height:76px;border-radius:16px;border:2px solid var(--line);background:var(--panel);
    color:var(--ink);font-size:38px;font-weight:700;cursor:pointer;transition:.12s}
  .counter button:hover{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
  .counter .val{font-size:56px;font-weight:800;min-width:88px;text-align:center;color:var(--warn)}

  .reactrow{display:flex;gap:14px;margin-bottom:22px}
  .react{flex:1;width:100%;padding:22px;border-radius:16px;border:none;background:var(--warn);color:#fff;
    font-size:25px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 2px 5px rgba(217,103,15,.25)}
  .react:hover{filter:brightness(1.06)}

  /* 두 화합물 비교 결과 */
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
  @media(max-width:700px){.compare{grid-template-columns:1fr}}
  .cbox{border:2px solid var(--line);border-radius:18px;padding:22px;background:var(--panel)}
  .cbox h4{font-size:27px;font-weight:800;margin-bottom:5px;text-align:center}
  .cbox .cformula{font-size:20px;color:var(--dim);text-align:center;margin-bottom:18px}
  .molrow{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:center;min-height:120px;margin-bottom:18px}
  .molecule{display:inline-flex;flex-direction:column;align-items:center;gap:5px}
  .madecount{text-align:center;font-size:24px;font-weight:800;margin-bottom:13px}
  .madecount .num{font-size:40px;color:var(--warn)}
  .leftover{font-size:20px;line-height:1.5;padding:15px 17px;border-radius:12px}
  .notyet{font-size:20px;color:var(--faint);text-align:center;padding:34px 14px}
  .leftover.has{background:var(--bad-bg);border:1px solid var(--bad-line);color:#a12a22}
  .leftover.none{background:var(--accent-bg);border:1px solid var(--accent-line);color:#0f7038}

  .q{margin-bottom:22px}
  .q label{display:block;font-size:23px;font-weight:700;margin-bottom:13px;line-height:1.5}
  .q textarea{width:100%;background:#f8fafc;border:2px solid var(--line);color:var(--ink);border-radius:12px;
    padding:16px;font-family:inherit;font-size:22px;line-height:1.55;resize:vertical;min-height:110px;margin-bottom:12px}
  .q textarea:focus{outline:none;border-color:var(--warn);background:#fff}
  .qhintbtn{width:100%;padding:14px;border-radius:12px;border:2px dashed var(--faint);background:transparent;
    color:var(--dim);font-size:19px;font-weight:700;cursor:pointer;font-family:inherit}
  .qhintbtn:hover{border-color:var(--warn);color:var(--warn);background:var(--warn-bg)}
  .qhint{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:12px;padding:16px 18px;margin-top:10px;
    font-size:18.5px;line-height:1.6;color:#8a4a12;display:none}
  .qhint.show{display:block}

  .done-btn{width:100%;padding:22px;border-radius:16px;border:none;background:var(--accent);color:#fff;
    font-size:25px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 2px 5px rgba(21,163,74,.22)}
  .done-btn:hover{filter:brightness(1.06)}
  .done-btn:disabled{opacity:.5;cursor:not-allowed}

  /* 성질 비교 (완료 후) */
  .property{border:1px solid var(--info);background:var(--info-bg);border-radius:18px;padding:24px;margin-top:20px;display:none}
  .property.show{display:block}
  .property h3{font-size:23px;color:var(--info);font-weight:800;margin-bottom:18px}
  .propgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:660px){.propgrid{grid-template-columns:1fr}}
  .propcard{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:19px 20px}
  .propcard .pf{font-size:27px;font-weight:800;margin-bottom:6px}
  .propcard .pr{font-size:20px;color:var(--warn);font-weight:700;margin-bottom:14px}
  .propcard .pd{font-size:20px;line-height:1.55;color:var(--ink)}
  .propcard.good{border-color:var(--accent-line);background:var(--accent-bg)} .propcard.good .pf{color:var(--accent)}
  .propcard.bad{border-color:var(--bad-line);background:var(--bad-bg)} .propcard.bad .pf{color:var(--bad)}
  .propnote{font-size:20px;line-height:1.6;color:var(--ink);margin-top:19px;padding-top:19px;border-top:1px solid #c7d6f0}
  .propnote b{color:var(--warn)}

  .lawnote{margin-top:26px;padding:24px 26px;background:#fff7ed;border:2px solid var(--warn-line);
    border-radius:16px;font-size:21px;line-height:1.7;color:var(--ink);display:none}
  .lawnote.show{display:block}
  .lawnote h3{font-size:22px;color:var(--warn);font-weight:800;margin-bottom:12px}
  .lawnote .lawdef{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:10px 0}
  .lawnote .lawdef b{color:var(--info)}
  .lawnote .lawreason b{color:var(--accent)}
  .lawword-reason{color:var(--accent);font-weight:800}
  .lawword-def{color:var(--info);font-weight:800}

  .blankline{font-size:21px;line-height:2;color:var(--ink);background:#f8fafc;border:1px solid var(--line);
    border-radius:12px;padding:16px 18px}
  .blankinput{width:132px;padding:8px 10px;margin:0 3px;border:2px solid var(--warn-line);border-radius:9px;
    background:#fff;color:var(--warn);font-family:inherit;font-size:19px;font-weight:800;text-align:center;vertical-align:middle}
  .blankinput:focus{outline:none;border-color:var(--warn);background:var(--warn-bg)}
  .blankinput.correct{border-color:var(--accent);background:var(--accent-bg);color:#0f5c30}

  .ratiotable{width:100%;border-collapse:collapse;margin-bottom:14px}
  .ratiotable th,.ratiotable td{border:1px solid var(--line);padding:12px 10px;text-align:center;font-size:19px}
  .ratiotable th{background:#f8fafc;color:var(--dim);font-weight:700}
  .ratiotable td:first-child{font-weight:700;background:#f8fafc;color:var(--dim)}
  .rt-compound{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:10px}
  .rt-mol{line-height:0}
  .rt-name{font-size:18px;font-weight:800;color:var(--ink)}
  .rt-ratiolabel{display:inline-block;background:var(--info-bg);color:var(--info);font-weight:800;
    font-size:17px;padding:6px 14px;border-radius:9px;border:1.5px solid #b9d3f5;letter-spacing:.02em}
  .rt-cell{display:inline-flex;align-items:center;gap:7px}
  .rt-num{width:56px;padding:9px 6px;border:2px solid var(--warn-line);border-radius:9px;
    background:#fff;color:var(--ink);font-family:inherit;font-size:19px;font-weight:700;text-align:center}
  .rt-num:focus{outline:none;border-color:var(--warn);background:var(--warn-bg)}
  .rt-colon{font-size:21px;font-weight:800;color:var(--faint)}
  .emph-red{color:#d63c33;font-weight:800}
  .readbox{background:#eef4ff;border:1.5px solid #b9d3f5;border-radius:14px;padding:18px 20px;
    margin-bottom:16px;font-size:19px;line-height:1.65;color:var(--ink)}
  .readbox .rb-tag{display:inline-block;font-size:13px;font-weight:800;letter-spacing:.04em;
    color:var(--info);background:#dbe8ff;padding:3px 10px;border-radius:999px;margin-bottom:8px}
  .pairchips{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:14px 0 6px}
  .pairchip{background:#eef4ff;border:1.5px solid #b9d3f5;border-radius:999px;padding:10px 20px;
    font-size:22px;font-weight:800;color:var(--info)}
  .pairchip .pcvs{color:var(--faint);font-weight:600;margin:0 6px;font-size:17px}

  .teacher{margin-top:30px}
  .teacherToggle{width:100%;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--panel);
    color:var(--dim);font-size:19px;font-weight:700;cursor:pointer;font-family:inherit}
  .tgate{display:none;margin-top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
  .tgate.show{display:block}
  .tgate input{background:#f8fafc;border:1px solid var(--line);color:var(--ink);border-radius:10px;padding:11px 13px;font-family:inherit;font-size:16px}
  .tgate button{padding:11px 17px;border-radius:10px;border:none;background:var(--warn);color:#fff;font-weight:700;cursor:pointer;font-family:inherit;margin-left:8px}
  .tstatus{font-size:15px;margin-top:10px;display:none;color:var(--dim)} .tstatus.show{display:block} .tstatus.err{color:var(--bad)} .tstatus.ok{color:var(--accent);font-weight:700}
  .tpanel{display:none;margin-top:12px} .tpanel.show{display:block}
  .tpanel table{width:100%;border-collapse:collapse;font-size:14px}
  .tpanel th,.tpanel td{border:1px solid var(--line);padding:8px 10px;text-align:center}
  .tpanel th{background:#f8fafc;color:var(--dim);font-weight:700}
  .tbtns{display:flex;gap:9px;margin:11px 0;flex-wrap:wrap}
  .tbtns button{padding:9px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-size:13px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">아레스 4 프로젝트</div>
    <h1>일정 성분비 법칙</h1>
  </header>

  <div class="story">
    워트니는 화성 기지에서 반응을 거듭하다 이상한 점을 발견했다. 수소와 산소, 딱 두 원소만 있으면 될 줄 알았는데 —
    어떨 땐 마시는 <b>물</b>이 만들어지고, 어떨 땐 상처를 소독하는 <b>약</b>이 만들어졌다. 같은 원소로 완전히 다른 물질이 나온 것이다.
    원자를 직접 조합해 보며, 무엇이 그 차이를 만드는지 대원인 여러분이 찾아보자.
  </div>

  <div class="missions" id="missions"></div>

  <div class="panel" id="missionPanel">
    <div class="goal" id="goal"></div>

    <div class="stockbar">
      <h3 id="stockTitle"></h3>
      <div class="stocks" id="stocks"></div>
    </div>

    <div class="reactrow">
      <button class="react" id="reactBtnL"></button>
      <button class="react" id="reactBtnR"></button>
    </div>

    <div class="compare" id="compare">
      <div class="cbox" id="cboxL"></div>
      <div class="cbox" id="cboxR"></div>
    </div>

    <div class="property" id="property"></div>
  </div>

  <div class="panel" id="assessPanel" style="display:none">
    <div class="concept" id="assessConcept"></div>
    <div class="masscards" id="assessMasscards"></div>

    <div class="assess" style="border:none;padding:0;margin-top:6px">
      <div class="idbar">
        <label>반</label>
        <select id="classNum">
          <option value="">선택</option>
          <option value="1">1반</option>
          <option value="2">2반</option>
          <option value="3">3반</option>
          <option value="4">4반</option>
        </select>
        <label>번호</label><input id="sid" inputmode="numeric" placeholder="예: 12" autocomplete="off">
        <span class="savenote" id="saveNote">반과 번호를 입력하면 활동이 자동 저장돼요</span>
      </div>
      <div class="privacy-note">※ 제출한 내용은 선생님이 확인할 수 있어요. 이름 대신 번호만 입력해주세요.</div>

      <div id="qArea"></div>

      <button class="done-btn" id="doneBtn">제출하기</button>
      <div class="tstatus" id="doneStatus" style="margin-top:13px;font-size:21px"></div>
    </div>

    <div class="lawnote" id="lawNote"></div>
  </div>

  <div class="teacher">
    <button class="teacherToggle" id="teacherToggle">교사용 보기</button>
    <div class="tgate" id="teacherGate">
      <input type="password" id="tcode" placeholder="교사 확인 코드" autocomplete="off">
      <button id="tcodeBtn">확인</button>
      <div class="tstatus" id="tcodeStatus"></div>
    </div>
    <div class="tpanel" id="teacherPanel">
      <div class="tbtns">
        <select id="classFilter" style="padding:9px;border-radius:8px;background:#f8fafc;color:var(--ink);border:1px solid var(--line);font-family:inherit;font-size:13px">
          <option value="all">전체 반</option>
          <option value="1">1반</option>
          <option value="2">2반</option>
          <option value="3">3반</option>
          <option value="4">4반</option>
        </select>
        <button id="refreshBtn">새로고침</button>
        <button id="copyBtn">표 복사</button>
        <button id="teacherResetBtn">전체 초기화</button>
      </div>
      <span class="tstatus" id="copyStatus"></span>
      <table><thead id="ttableHead"></thead><tbody id="ttableBody"></tbody></table>
      <div id="ttableEmpty" style="text-align:center;color:var(--faint);padding:18px;font-size:14px">아직 제출된 활동이 없어요</div>
    </div>
  </div>
</div>

<script>
  var GAS_URL = 'https://script.google.com/macros/s/AKfycbwgEYnse41-azEcinviKYl5v_mSXNkt6EtfqtStu1xxPBU8M6wbbps18qsx7g8Aev-H/exec';
  function submitToSheet(sim, record, onDone){
    var done = false;
    var timer = setTimeout(function(){
      if(done) return;
      done = true;
      onDone(false, true);
    }, 8000);
    try{
      var payload = Object.assign({sim: sim}, record);
      fetch(GAS_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: JSON.stringify(payload)
      }).then(function(){
        if(done) return;
        done = true;
        clearTimeout(timer);
        onDone(true, false);
      }).catch(function(){
        if(done) return;
        done = true;
        clearTimeout(timer);
        onDone(false, false);
      });
    } catch(e){
      if(!done){
        done = true;
        clearTimeout(timer);
        onDone(false, false);
      }
    }
  }
(function(){
  "use strict";
  var ATOM = {
    H:{col:'#ffffff', txt:'#16202f', mass:1, r:'수소'},
    O:{col:'#ef4444', txt:'#ffffff', mass:16, r:'산소'},
    C:{col:'#475569', txt:'#ffffff', mass:12, r:'탄소'},
    N:{col:'#3b82f6', txt:'#ffffff', mass:14, r:'질소'}
  };

  // 결합선 없이 원자를 화합물답게 겹쳐 붙여 배치 (한 덩어리로 보이게)
  var STRUCT = {
    // 물: 산소 중심에 수소 2개가 살짝 겹쳐 붙음
    water:{ w:128,h:104, atoms:[{s:'O',x:64,y:44},{s:'H',x:32,y:76},{s:'H',x:96,y:76}] },
    // 과산화수소: 산소 2개가 가운데 붙고, 수소가 양끝에 붙음
    peroxide:{ w:184,h:96, atoms:[{s:'O',x:76,y:52},{s:'O',x:116,y:44},{s:'H',x:40,y:68},{s:'H',x:152,y:60}] },
    // 일산화탄소: 탄소-산소 붙음
    co:{ w:104,h:72, atoms:[{s:'C',x:40,y:36},{s:'O',x:72,y:36}] },

  function molSVG(key){
    var st=STRUCT[key]; if(!st) return '';
    var R=26;
    var svg='<svg width="'+st.w+'" height="'+st.h+'" viewBox="0 0 '+st.w+' '+st.h+'">';
    // 결합선 없이 원자만 (겹쳐 붙어 한 분자로 보임)
    st.atoms.forEach(function(a){
      var A=ATOM[a.s];
      svg+='<circle cx="'+a.x+'" cy="'+a.y+'" r="'+R+'" fill="'+A.col+'" stroke="rgba(20,30,50,.4)" stroke-width="2.5"/>';
      svg+='<text x="'+a.x+'" y="'+(a.y+7)+'" text-anchor="middle" font-size="22" font-weight="800" fill="'+A.txt+'">'+a.s+'</text>';
    });
    svg+='</svg>';
    return svg;
  }

  // 형성평가 표 헤더용 소형 분자 모형 — 원소 기호 대신 원자량 숫자를 표시, 겹침을 최소화해서 숫자가 안 가려지게 함
  function molSVGMass(key){
    var st=STRUCT[key]; if(!st) return '';
    var R=14, targetGap=1;
    var cx0=st.atoms[0].x, cy0=st.atoms[0].y;
    var base = st.atoms.map(function(a){ return { s:a.s, x:a.x-cx0, y:a.y-cy0 }; });
    function minGapAt(scale){
      var g=Infinity;
      for(var i=0;i<base.length;i++){
        for(var j=i+1;j<base.length;j++){
          var dx=(base[i].x-base[j].x)*scale, dy=(base[i].y-base[j].y)*scale;
          var dist=Math.sqrt(dx*dx+dy*dy);
          var gap=dist-2*R;
          if(gap<g) g=gap;
        }
      }
      return g;
    }
    // 분자 형태(원자 수·배치)와 상관없이 최소 간격이 목표값에 가까워지도록 위치 배율을 이분 탐색으로 계산
    var lo=0.15, hi=2.0;
    for(var iter=0; iter<28; iter++){
      var mid=(lo+hi)/2;
      if(minGapAt(mid) < targetGap) lo=mid; else hi=mid;
    }
    var posScale = base.length>1 ? hi : 1;
    var pts = base.map(function(p){ return { s:p.s, x:p.x*posScale, y:p.y*posScale }; });
    var pad=3;
    var minX=Math.min.apply(null,pts.map(function(p){return p.x-R;}))-pad;
    var maxX=Math.max.apply(null,pts.map(function(p){return p.x+R;}))+pad;
    var minY=Math.min.apply(null,pts.map(function(p){return p.y-R;}))-pad;
    var maxY=Math.max.apply(null,pts.map(function(p){return p.y+R;}))+pad;
    var w=maxX-minX, h=maxY-minY;
    var svg='<svg width="'+w+'" height="'+h+'" viewBox="'+minX+' '+minY+' '+w+' '+h+'">';
    pts.forEach(function(p){
      var A=ATOM[p.s];
      var fs = (A.mass>=10) ? 12 : 14;
      svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="'+R+'" fill="'+A.col+'" stroke="rgba(20,30,50,.4)" stroke-width="1.4"/>';
      svg+='<text x="'+p.x+'" y="'+(p.y+fs*0.35)+'" text-anchor="middle" font-size="'+fs+'" font-weight="800" fill="'+A.txt+'">'+A.mass+'</text>';
    });
    svg+='</svg>';
    return svg;
  }

      ta.addEventListener('input', function(){
        answers[ta.dataset.q] = ta.value;
        el.doneStatus.className='tstatus';
      });
    });
    [].forEach.call(el.qArea.querySelectorAll('.rt-num'), function(inp){
      inp.addEventListener('input', function(){
        var v = inp.value.replace(/[^0-9]/g,'');
        inp.value = v;
        answers[inp.dataset.q][inp.dataset.side][+inp.dataset.idx][inp.dataset.part] = v;
        el.doneStatus.className='tstatus';
      });
    });
    ['q6_0','q6_1','q7_0','q7_1'].forEach(function(id){
      var inp = document.getElementById(id);
      if(!inp) return;
      inp.addEventListener('input', function(){
        var qk = id.slice(0,2), idx = +id.slice(3);
        answers[qk][idx] = inp.value.trim();
        el.doneStatus.className='tstatus';
        var target = qk==='q6' ? Q6_TARGET : Q7_TARGET;
        inp.classList.toggle('correct', inp.value.trim()===target[idx]);
      });
    });

    if(assessSubmitted) showLawNote();
    else { el.lawNote.classList.remove('show'); el.lawNote.innerHTML=''; }

    el.doneStatus.className='tstatus';
  }

  function showLawNote(){
    el.lawNote.innerHTML =
      '<h3>왜 <span class="lawword-reason">"근거"</span>와 <span class="lawword-def">"정의"</span>가 다를까?</h3>'+
      '<div class="lawreason">6번의 <span class="lawword-reason">근거</span> — 성분 원소의 <b>개수비</b>가 일정하다는 설명이에요.</div>'+
      '<div class="lawdef">7번의 <span class="lawword-def">정의</span> — 성분 원소의 <b>질량비</b>가 일정하다는 설명이에요.</div>'+
      '같은 사실을 가리키지만, 법칙은 처음부터 <span class="lawword-def">질량비(정의)</span>로 표현돼요. 7번 앞에서 읽었듯, 프루스트가 이 법칙을 발견한 18세기 말엔 원자를 셀 수 없어 저울로 질량만 잴 수 있었기 때문이에요. 돌턴의 원자설이 나온 뒤에야 "원자가 정해진 개수비로 결합한다"는 <span class="lawword-reason">근거</span>가 뒤따라 밝혀졌어요.';
    el.lawNote.classList.add('show');
    el.lawNote.scrollIntoView({behavior:'smooth',block:'nearest'});
  }


  el.doneBtn.addEventListener('click', function(){
    var id=currentIdentity();
    if(!id.classNum||!id.sid){
      el.doneStatus.textContent='반과 번호를 먼저 입력해주세요.';
      el.doneStatus.className='tstatus show err';
      return;
    }
    var textKeys=['q1','q5'];
    for(var i=0;i<textKeys.length;i++){
      if(answers[textKeys[i]].trim().length<5){
        el.doneStatus.textContent='아직 채우지 않았거나 너무 짧은 질문이 있어요. 조금 더 자세히 써주세요.';
        el.doneStatus.className='tstatus show err';
        var ta=el.qArea.querySelector('textarea[data-q="'+textKeys[i]+'"]');
        if(ta) ta.focus();
        return;
      }
    }
    var tableKeys=['q2','q3','q4'];
    for(var j=0;j<tableKeys.length;j++){
      var t=answers[tableKeys[j]];
      var cellFilled=function(c){ return c.a.trim().length>0 && c.b.trim().length>0; };
      var allFilled = t.left.every(cellFilled) && t.right.every(cellFilled);
      if(!allFilled){
        el.doneStatus.textContent='아직 채우지 않은 질량비 칸이 있어요.';
        el.doneStatus.className='tstatus show err';
        return;
      }
    }
    var blankOk = answers.q6[0]===Q6_TARGET[0] && answers.q6[1]===Q6_TARGET[1] &&
                  answers.q7[0]===Q7_TARGET[0] && answers.q7[1]===Q7_TARGET[1];
    if(!blankOk){
      el.doneStatus.textContent='6·7번 빈칸 중 아직 맞지 않은 칸이 있어요.';
      el.doneStatus.className='tstatus show err';
      return;
    }
    el.doneBtn.disabled=true;
    el.doneBtn.textContent='제출 중...';
    saveProgress(function(ok){
      el.doneBtn.disabled=false;
      el.doneBtn.textContent='제출하기';
      if(ok){
        assessSubmitted=true;
        buildMissions();
        el.doneStatus.textContent='제출 완료! 다시 제출하면 이전 내용을 덮어써요.';
        el.doneStatus.className='tstatus show ok';
        showLawNote();
      }
    });
  });

  function renderStock(){
    var m=cur();
    el.stocks.innerHTML=[m.a,m.b].map(function(sym){
      var A=ATOM[sym];
      return '<div class="stockone">'+
        '<div class="lbl"><span class="swatch" style="background:'+A.col+'"></span>'+A.r+' ('+sym+')</div>'+
        '<div class="counter">'+
          '<button data-sym="'+sym+'" data-d="-1">−</button>'+
          '<span class="val">'+stock[sym]+'</span>'+
          '<button data-sym="'+sym+'" data-d="1">+</button>'+
        '</div></div>';
    }).join('');
    [].forEach.call(el.stocks.querySelectorAll('button'),function(b){
      b.addEventListener('click',function(){
        var s=b.dataset.sym,d=+b.dataset.d;
        stock[s]=Math.max(0,Math.min(20,stock[s]+d));
        renderStock();
      });
    });
  }

  function makeCompound(comp){
    var per=comp.per;
    var nMol=Math.min.apply(null,Object.keys(per).map(function(s){return Math.floor((stock[s]||0)/per[s]);}));
    if(nMol<0||!isFinite(nMol)) nMol=0;
    var left={};
    Object.keys(per).forEach(function(s){ left[s]=(stock[s]||0)-nMol*per[s]; });
    return {nMol:nMol, left:left};
  }

  function renderBox(box, comp){
    var res=makeCompound(comp);
    var mols='';
    if(res.nMol===0){
      mols='<span style="color:var(--faint);font-size:20px">아직 만들 수 없어요</span>';
    } else {
      var one='<div class="molecule">'+molSVG(comp.struct)+'</div>';
      for(var i=0;i<res.nMol;i++) mols+=one;
    }
    var leftMsg=[], hasLeft=false;
    Object.keys(res.left).forEach(function(s){ if(res.left[s]>0){hasLeft=true; leftMsg.push(ATOM[s].r+'('+s+') '+res.left[s]+'개');} });
    var leftHTML;
    if(hasLeft) leftHTML='<div class="leftover has">남은 원소: '+leftMsg.join(', ')+'</div>';
    else if(res.nMol>0) leftHTML='<div class="leftover none">남는 원소 없음 ✓</div>';
    else leftHTML='<div class="leftover has">원소가 부족해요</div>';

    box.innerHTML=
      '<h4>'+comp.name+'</h4>'+
      '<div class="cformula">'+comp.formula+'</div>'+
      '<div class="madecount"><span class="num">'+res.nMol+'</span>개 만들어짐</div>'+
      '<div class="molrow">'+mols+'</div>'+
      leftHTML;
  }

  function placeholderBox(box, comp){
    box.innerHTML=
      '<h4>'+comp.name+'</h4>'+
      '<div class="cformula">'+comp.formula+'</div>'+
      '<div class="notyet">"'+comp.name+' 만들기"를 눌러보세요</div>';
  }

  var madeLeft=false, madeRight=false;

  function reactOne(box, comp, isLeft){
    var m=cur();
    if((stock[m.a]||0)===0 && (stock[m.b]||0)===0){
      box.innerHTML='<h4>'+comp.name+'</h4><div class="cformula">'+comp.formula+'</div>'+
        '<div class="notyet">먼저 위에서 <b>원자 개수를 정해</b> 보세요.<br>(＋ 버튼을 눌러 원자를 넣어요)</div>';
      return;
    }
    renderBox(box, comp);
    var res=makeCompound(comp);
    if(isLeft) madeLeft = res.nMol>0; else madeRight = res.nMol>0;
    maybeShowProperty(m);
  }

  function maybeShowProperty(m){
    if(!(madeLeft && madeRight)) return;
      var p=m.prop;
      el.property.innerHTML=
        '<h3>✓ 성분비가 다르면 성질도 달라요</h3>'+
        '<div class="propgrid">'+
          '<div class="propcard '+p.good.cls+'"><div class="pf">'+p.good.f+'</div><div class="pr">'+p.good.r+'</div><div class="pd">'+p.good.d+'</div></div>'+
          '<div class="propcard '+p.bad.cls+'"><div class="pf">'+p.bad.f+'</div><div class="pr">'+p.bad.r+'</div><div class="pd">'+p.bad.d+'</div></div>'+
        '</div>'+
        '<div class="propnote">'+p.note+'</div>';
      if(!el.property.classList.contains('show')){
        el.property.classList.add('show');
        el.property.scrollIntoView({behavior:'smooth',block:'nearest'});
      }
  }

  el.reactBtnL.addEventListener('click', function(){ reactOne(el.cboxL, cur().left, true); });
  el.reactBtnR.addEventListener('click', function(){ reactOne(el.cboxR, cur().right, false); });

  // ===== 저장 =====
  function sanitizeId(raw){ return String(raw||'').trim().replace(/[\s\/\\'"]/g,''); }
  function currentIdentity(){ return { classNum: el.classNum.value, sid: sanitizeId(el.sid.value) }; }
  var saveTimer=null;
  function saveProgress(cb){
    var id=currentIdentity();
    if(!id.classNum||!id.sid){
      el.saveNote.textContent='반과 번호를 입력하면 활동이 자동 저장돼요'; el.saveNote.className='savenote';
      if(cb) cb(false);
      return;
    }
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer=setTimeout(function(){
      var rec={ classNum:id.classNum, studentId:id.sid, answers:answers, updated:new Date().toISOString() };
      submitToSheet('ratio', rec, function(ok, timedOut){
        if(ok){ el.saveNote.textContent='저장됨 · '+new Date().toLocaleTimeString('ko-KR'); el.saveNote.className='savenote active'; if(cb) cb(true); }
        else if(timedOut){ el.saveNote.textContent='응답이 없어요. 인터넷 연결을 확인해주세요.'; el.saveNote.className='savenote'; if(cb) cb(false); }
        else { el.saveNote.textContent='저장 실패 - 인터넷을 확인해주세요'; el.saveNote.className='savenote'; if(cb) cb(false); }
      });
    },400);
  }
  el.classNum.addEventListener('change', function(){ saveProgress(); });
  el.sid.addEventListener('change', function(){ saveProgress(); });
  el.sid.addEventListener('blur', function(){ saveProgress(); });

  // ===== 교사용 =====
  var ANSWER_COLS = [
    { key:'q1', label:'형성평가1' },
    { key:'q2', label:'형성평가2(물·과산화수소 질량비)' },
    { key:'q3', label:'형성평가3(일산화·이산화탄소 질량비)' },
    { key:'q4', label:'형성평가4(일산화·이산화질소 질량비)' },
    { key:'q5', label:'형성평가5' },
    { key:'q6', label:'형성평가6(근거)' },
    { key:'q7', label:'형성평가7(정의)' }
  ];
  function formatAnswerCell(rec, key){
    var v = rec.answers && rec.answers[key];
    if(v==null) return '';
    if(typeof v==='string') return v;
    if(Array.isArray(v)) return v.join(' / '); // q6, q7 빈칸 2개
    // 질량비 표(q2~q4): 1개/3개 값을 한 줄로 정리
    var rowLabels=[1,2];
    var fmt=function(arr){ return (arr||[]).map(function(c,i){ return rowLabels[i]+'개 '+(c.a||'')+':'+(c.b||''); }).join(', '); };
    return '왼쪽[ '+fmt(v.left)+' ] 오른쪽[ '+fmt(v.right)+' ]';
  }
  var TEACHER_CODE='dltndltn';
  var elT={
    toggle:document.getElementById('teacherToggle'), gate:document.getElementById('teacherGate'),
    tcode:document.getElementById('tcode'), tcodeBtn:document.getElementById('tcodeBtn'),
    tcodeStatus:document.getElementById('tcodeStatus'), panel:document.getElementById('teacherPanel'),
    classFilter:document.getElementById('classFilter'), refresh:document.getElementById('refreshBtn'),
    copy:document.getElementById('copyBtn'), copyStatus:document.getElementById('copyStatus'),
    reset:document.getElementById('teacherResetBtn'), head:document.getElementById('ttableHead'),
    body:document.getElementById('ttableBody'), empty:document.getElementById('ttableEmpty')
  };
  var teacherOpen=false, allRows=[], lastRows=[];
  function esc2(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML; }
  elT.toggle.addEventListener('click', function(){
    if(teacherOpen){ elT.gate.classList.remove('show'); elT.panel.classList.remove('show'); teacherOpen=false; elT.toggle.textContent='교사용 보기'; }
    else { elT.gate.classList.add('show'); teacherOpen=true; elT.toggle.textContent='교사용 닫기'; }
  });
  elT.tcodeBtn.addEventListener('click', checkCode2);
  elT.tcode.addEventListener('keydown', function(e){ if(e.key==='Enter') checkCode2(); });
  function checkCode2(){
    if(elT.tcode.value.trim()===TEACHER_CODE){ openTeacherPanel2(); }
    else { elT.tcodeStatus.textContent='코드가 일치하지 않아요.'; elT.tcodeStatus.className='tstatus show err'; }
  }
  function openTeacherPanel2(){ elT.gate.classList.remove('show'); elT.panel.classList.add('show'); loadSubmissions2(); }

  function loadSubmissions2(){
    elT.body.innerHTML=''; elT.empty.style.display='block'; elT.empty.textContent='불러오는 중...';
    if(!window.storage||typeof window.storage.list!=='function'){
      elT.empty.textContent='저장 기능을 쓸 수 없는 화면이에요. Claude가 안내한 링크로 열어주세요.';
      return;
    }
    var done=false;
    var timer=setTimeout(function(){
      if(done) return; done=true;
      elT.empty.textContent='응답이 없어요. 인터넷 연결을 확인하고 새로고침을 눌러보세요.';
    },8000);
    Promise.resolve().then(function(){
      return window.storage.list('sub-ratio-', true);
    }).then(function(res){
      if(done) return;
      var keys=(res&&res.keys)||[];
      if(!keys.length){ done=true; clearTimeout(timer); allRows=[]; renderRows2(); return; }
      return Promise.all(keys.map(function(k){
        return window.storage.get(k,true).catch(function(){ return null; });
      })).then(function(results){
        if(done) return; done=true; clearTimeout(timer);
        allRows = results
          .filter(function(r){ return r && r.value; })
          .map(function(r){ try{ return JSON.parse(r.value); }catch(e){ return null; } })
          .filter(Boolean);
        renderRows2();
      });
    }).catch(function(){
      if(done) return; done=true; clearTimeout(timer);
      elT.empty.textContent='불러오기에 실패했어요. 새로고침을 눌러보세요.';
    });
  }

  function updateResetLabel(){
    var f=elT.classFilter.value;
    elT.reset.dataset.label = (f==='all') ? '전체 초기화' : (f+'반 초기화');
    disarmReset();
  }

  function renderRows2(){
    var filter=elT.classFilter.value;
    var rows=allRows.filter(function(r){ return filter==='all'||String(r.classNum)===String(filter); });
    rows.sort(function(a,b){ return (a.classNum-b.classNum)||(String(a.studentId).localeCompare(String(b.studentId),'ko',{numeric:true})); });
    lastRows=rows;
    elT.head.innerHTML='<tr><th>반</th><th>번호</th>'+
      ANSWER_COLS.map(function(c){return '<th>'+esc2(c.label)+'</th>';}).join('')+
      '<th>제출시각</th></tr>';
    if(!rows.length){ elT.body.innerHTML=''; elT.empty.style.display='block'; elT.empty.textContent='아직 제출된 활동이 없어요'; return; }
    elT.empty.style.display='none';
    elT.body.innerHTML=rows.map(function(r){
      var acells=ANSWER_COLS.map(function(c){
        return '<td style="text-align:left;max-width:220px;white-space:normal">'+esc2(formatAnswerCell(r,c.key))+'</td>';
      }).join('');
      var t=r.updated?new Date(r.updated).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
      return '<tr><td>'+esc2(r.classNum)+'반</td><td>'+esc2(r.studentId)+'</td>'+acells+'<td style="font-size:12px;color:var(--faint)">'+t+'</td></tr>';
    }).join('');
  }
  elT.classFilter.addEventListener('change', function(){ renderRows2(); updateResetLabel(); });
  elT.refresh.addEventListener('click', loadSubmissions2);
  elT.copy.addEventListener('click', function(){
    if(!lastRows.length){ showCopyStatus2('복사할 데이터가 없어요',false); return; }
    var header=['반','번호'].concat(ANSWER_COLS.map(function(c){return c.label;})).concat(['수정시각']).join('\t');
    var body=lastRows.map(function(r){
      var acells=ANSWER_COLS.map(function(c){
        return formatAnswerCell(r,c.key).replace(/\t/g,' ').replace(/\n/g,' ');
      });
      var t=r.updated?new Date(r.updated).toLocaleString('ko-KR'):'';
      return [r.classNum+'반',r.studentId].concat(acells).concat([t]).join('\t');
    }).join('\n');
    var txt=header+'\n'+body;
    if(legacyCopy2(txt)){ showCopyStatus2('표를 복사했어요. 스프레드시트에 붙여넣기 하세요.',true); return; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ showCopyStatus2('표를 복사했어요.',true); })
        .catch(function(){ showCopyStatus2('자동 복사가 막혀 있어요. 표를 직접 드래그해서 복사해주세요.',false); });
    } else { showCopyStatus2('이 화면에서는 자동 복사가 지원되지 않아요.',false); }
  });
  function showCopyStatus2(msg,ok){ elT.copyStatus.textContent=msg; elT.copyStatus.className='tstatus show'+(ok?' ok':' err'); }
  function legacyCopy2(txt){
    var ta=document.createElement('textarea'); ta.value=txt; ta.setAttribute('readonly','');
    ta.style.position='fixed'; ta.style.left='-9999px';
    document.body.appendChild(ta); ta.focus(); ta.select();
    var ok=false; try{ ok=document.execCommand('copy'); }catch(e){ ok=false; }
    document.body.removeChild(ta);
    return ok;
  }
  var resetArmed=false, resetTimer=null;
  function disarmReset(){
    resetArmed=false;
    if(resetTimer){ clearTimeout(resetTimer); resetTimer=null; }
    elT.reset.textContent = elT.reset.dataset.label || '전체 초기화';
  }
  updateResetLabel();
  elT.reset.addEventListener('click', function(){
    if(!lastRows.length){ showCopyStatus2('삭제할 데이터가 없어요',false); return; }
    if(!resetArmed){
      resetArmed=true;
      elT.reset.textContent='정말요? 다시 누르면 삭제';
      resetTimer=setTimeout(disarmReset,4000);
      return;
    }
    disarmReset();
    if(!window.storage||typeof window.storage.delete!=='function'){ showCopyStatus2('저장 기능을 쓸 수 없는 화면이에요',false); return; }
    var targets=lastRows.slice();
    var keys=targets.map(function(r){ return 'sub-ratio-'+r.classNum+'-'+r.studentId; });
    showCopyStatus2('삭제하는 중...',true);
    Promise.all(keys.map(function(k){ return window.storage.delete(k,true).catch(function(){ return null; }); })).then(function(){
      var removed={}; keys.forEach(function(k){ removed[k]=true; });
      allRows=allRows.filter(function(r){ return !removed['sub-ratio-'+r.classNum+'-'+r.studentId]; });
      renderRows2();
      showCopyStatus2(targets.length+'건 삭제했어요.',true);
    }).catch(function(){ showCopyStatus2('삭제 중 일부 실패했어요. 새로고침 후 다시 확인해주세요.',false); });
  });

  buildMissions();
  loadMission();
})();
</script>
</body>
</html>
